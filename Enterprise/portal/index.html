<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT-Toolkit Enterprise</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%2338bdf8' d='M16 2l12 5v9c0 7-5 12-12 14-7-2-12-7-12-14V7z'/%3E%3Cpath fill='%230b1220' d='M16 7l7 3v5c0 4-3 7-7 9-4-2-7-5-7-9v-5z'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#0b1220; --bg-2:#0f172a; --panel:#151e31; --panel-2:#1c2942; --line:#223049; --line-2:#31425f;
    --text:#e8eef7; --muted:#93a3b8;
    --accent:#38bdf8; --good:#34d399; --bad:#f87171; --warn:#fbbf24; --info:#60a5fa;
    --side-w:248px; --radius:12px;
    --shadow:0 10px 30px -14px rgba(0,0,0,.6);
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--text); font-size:13.5px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  svg.ic { width:17px; height:17px; flex:none; vertical-align:middle; }
  a { color:var(--accent); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  ::selection { background:color-mix(in srgb,var(--accent) 28%,transparent); }

  /* ================================================================ layout */
  .app { display:flex; min-height:100vh; }
  .sidebar { position:fixed; top:0; left:0; bottom:0; width:var(--side-w); background:#0a101e; border-right:1px solid var(--line); display:flex; flex-direction:column; z-index:60; }
  .main-col { flex:1; margin-left:var(--side-w); display:flex; flex-direction:column; min-width:0; min-height:100vh; }
  body.auth .sidebar { display:none !important; }
  body.auth .main-col { margin-left:0; }
  body.auth .topbar { display:none !important; }

  /* ================================================================ sidebar */
  .brand { display:flex; align-items:center; gap:11px; padding:16px 16px 14px; border-bottom:1px solid var(--line); }
  .logo-mark { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; background:color-mix(in srgb,var(--accent) 16%,transparent); color:var(--accent); }
  .logo-mark svg.ic { width:19px; height:19px; }
  .b-name { font-size:13.5px; font-weight:700; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .b-sub { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
  nav { flex:1; overflow-y:auto; overflow-x:hidden; padding:4px 10px 12px; display:flex; flex-direction:column; gap:2px; }
  .nav-label { margin:16px 8px 5px; font-size:9.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .nav-label::after { content:""; flex:1; height:1px; background:var(--line); }
  nav button { display:flex; align-items:center; gap:10px; width:100%; background:transparent; border:none; border-radius:8px; color:var(--muted); padding:8px 10px; font-size:13px; font-weight:500; cursor:pointer; text-align:left; font-family:inherit; transition:background .12s ease, color .12s ease; }
  nav button:hover { background:rgba(255,255,255,.05); color:var(--text); }
  nav button.active { background:color-mix(in srgb,var(--accent) 13%,transparent); color:var(--accent); box-shadow:inset 3px 0 0 var(--accent); font-weight:600; }
  nav button .alert-badge { margin-left:auto; background:var(--bad); color:#1a0d12; border-radius:999px; padding:0 7px; font-size:10.5px; font-weight:700; line-height:16px; }
  .side-foot { border-top:1px solid var(--line); padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .side-user { display:flex; align-items:center; gap:10px; min-width:0; }
  .avatar { width:30px; height:30px; border-radius:50%; flex:none; display:grid; place-items:center; font-weight:700; font-size:12px; text-transform:uppercase; background:color-mix(in srgb,var(--accent) 18%,transparent); color:var(--accent); }
  .u-meta { min-width:0; }
  .u-name { font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .u-role { font-size:10.5px; color:var(--muted); text-transform:capitalize; letter-spacing:.04em; }
  .logout-btn { display:flex; align-items:center; gap:8px; background:transparent; border:1px solid var(--line); color:var(--muted); padding:7px 10px; border-radius:8px; cursor:pointer; font-size:12px; font-family:inherit; }
  .logout-btn:hover { color:var(--bad); border-color:var(--bad); background:color-mix(in srgb,var(--bad) 8%,transparent); }

  /* ================================================================ topbar */
  .topbar { position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:14px; padding:14px 26px; background:color-mix(in srgb,var(--bg-2) 82%,transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .page-desc h2 { margin:0; font-size:16px; font-weight:700; display:flex; align-items:center; gap:9px; letter-spacing:.01em; }
  .page-desc h2 svg.ic { color:var(--accent); }
  .page-desc p { margin:2px 0 0; font-size:12px; color:var(--muted); }
  .topbar .spacer { margin-left:auto; }
  .menu-btn { display:none; background:transparent; border:1px solid var(--line-2); color:var(--muted); border-radius:8px; width:34px; height:34px; place-items:center; cursor:pointer; padding:0; }
  .icon-btn { display:inline-flex; align-items:center; gap:7px; background:transparent; border:1px solid var(--line-2); color:var(--muted); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12.5px; font-family:inherit; }
  .icon-btn:hover { color:var(--text); border-color:var(--accent); }
  .ingest-banner { display:flex; align-items:center; gap:10px; padding:8px 26px; background:color-mix(in srgb,var(--bad) 12%,var(--bg-2)); border-bottom:1px solid color-mix(in srgb,var(--bad) 35%,transparent); color:#fecaca; font-size:12.5px; }
  .ingest-banner svg.ic { color:var(--bad); }
  .ingest-banner .dismiss { margin-left:auto; background:transparent; border:none; color:var(--muted); cursor:pointer; padding:2px; display:grid; place-items:center; }
  .ingest-banner .dismiss:hover { color:var(--text); }

  /* ================================================================ content */
  main { padding:20px 26px 44px; width:100%; max-width:1360px; margin:0 auto; }
  .statcards { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:13px 15px; display:flex; align-items:center; gap:13px; box-shadow:var(--shadow); min-width:0; }
  .stat .s-ic { width:38px; height:38px; border-radius:10px; display:grid; place-items:center; flex:none; }
  .stat .s-ic svg.ic { width:19px; height:19px; }
  .stat .s-kind { min-width:0; }
  .stat .s-val { font-size:22px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:.01em; }
  .stat .s-lab { font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600; margin-top:3px; }
  .stat .s-sub { font-size:11px; color:var(--muted); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stat[data-tone="accent"] .s-ic { background:color-mix(in srgb,var(--accent) 15%,transparent); color:var(--accent); }
  .stat[data-tone="good"] .s-ic { background:color-mix(in srgb,var(--good) 15%,transparent); color:var(--good); }
  .stat[data-tone="bad"]  .s-ic { background:color-mix(in srgb,var(--bad) 15%,transparent); color:var(--bad); }
  .stat[data-tone="warn"] .s-ic { background:color-mix(in srgb,var(--warn) 15%,transparent); color:var(--warn); }
  .stat[data-tone="info"] .s-ic { background:color-mix(in srgb,var(--info) 15%,transparent); color:var(--info); }

  /* ================================================================ cards */
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px; box-shadow:var(--shadow); overflow-x:auto; }
  .card h3 { margin:0 0 10px; font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .card h3 + p { margin-top:0; }
  h3 { font-size:14px; }
  p { margin:6px 0; }

  /* ================================================================ tables */
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); text-transform:uppercase; font-size:10.5px; letter-spacing:.06em; font-weight:600; background:color-mix(in srgb,var(--panel-2) 40%,transparent); position:sticky; top:0; }
  tbody tr:hover { background:rgba(255,255,255,.025); }
  td.muted { color:var(--muted); }
  tr:last-child td { border-bottom:none; }

  /* ================================================================ badges */
  .badge { display:inline-flex; align-items:center; gap:5px; padding:2.5px 9px; border-radius:999px; font-size:10.5px; font-weight:700; letter-spacing:.03em; white-space:nowrap; background:#ffffff12; color:var(--muted); }
  .badge.on  { background:color-mix(in srgb,var(--good) 15%,transparent); color:var(--good); }
  .badge.ok  { background:color-mix(in srgb,var(--good) 15%,transparent); color:var(--good); }
  .badge.off { background:color-mix(in srgb,var(--bad) 15%,transparent); color:var(--bad); }
  .badge.warn{ background:color-mix(in srgb,var(--warn) 15%,transparent); color:var(--warn); }
  .badge.info{ background:color-mix(in srgb,var(--info) 15%,transparent); color:var(--info); }

  /* ================================================================ buttons */
  button.action, a.action { display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--accent); color:#06222f; border:none; border-radius:8px; padding:6px 14px; font-size:12.5px; font-weight:700; cursor:pointer; text-decoration:none; font-family:inherit; transition:filter .12s ease; }
  button.action:hover, a.action:hover { filter:brightness(1.09); }
  button.link { background:none; border:none; padding:0; color:var(--accent); font:inherit; font-weight:600; cursor:pointer; text-align:left; }
  button.link:hover { text-decoration:underline; }
  button.ghost, a.ghost { display:inline-flex; align-items:center; justify-content:center; gap:6px; background:transparent; border:1px solid var(--line-2); color:var(--text); padding:6px 14px; border-radius:8px; cursor:pointer; font-size:12.5px; font-weight:500; text-decoration:none; font-family:inherit; transition:background .12s ease, border-color .12s ease; }
  button.ghost:hover, a.ghost:hover { background:rgba(255,255,255,.05); border-color:var(--accent); }
  button.ghost.active, a.ghost.active { background:color-mix(in srgb,var(--accent) 14%,transparent); border-color:var(--accent); color:var(--accent); font-weight:600; }

  /* ================================================================ forms */
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; font-weight:500; }
  input, textarea, select { width:100%; background:var(--bg-2); border:1px solid var(--line-2); color:var(--text); border-radius:8px; padding:8px 10px; font-size:13px; font-family:inherit; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent); }
  textarea { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
  select { cursor:pointer; }
  input[type="color"] { padding:2px; height:38px; }

  /* ================================================================ code */
  pre { background:#0a101f; border:1px solid var(--line); padding:12px; border-radius:10px; overflow:auto; max-height:320px; font-size:12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; line-height:1.5; }
  code { background:rgba(255,255,255,.08); border:1px solid var(--line); padding:1px 6px; border-radius:6px; font-size:11px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; background:#0a101f; border:1px solid var(--line); padding:10px; border-radius:8px; overflow:auto; white-space:pre-wrap; word-break:break-all; }

  /* ================================================================ misc */
  .muted { color:var(--muted); }
  .error { color:var(--bad); font-size:13px; margin-top:10px; font-weight:500; }
  .row { display:flex; gap:10px; align-items:center; }
  .steps { list-style:none; margin:12px 0 0; padding:0; counter-reset:st; }
  .steps li { counter-increment:st; display:flex; align-items:flex-start; gap:10px; padding:7px 0; font-size:13px; color:var(--text); line-height:1.5; }
  .steps li::before { content:counter(st); flex:0 0 26px; height:26px; border-radius:999px; background:color-mix(in srgb,var(--accent) 16%,transparent); color:var(--accent); font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  .steps li code { background:#0a101f; border:1px solid var(--line); border-radius:6px; padding:1px 8px; font-size:12px; }
  .center { max-width:460px; margin:7vh auto 0; }
  .center h2 { margin:0 0 4px; font-size:19px; }
  .center.card { padding:26px; }
  .dash-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  .quick-links { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }

  /* ================================================================ performance (Phase A) */
  .perf-controls { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; }
  .perf-controls label { margin:0; }
  .perf-controls select { width:auto; min-width:180px; }
  .seg-group { display:inline-flex; border:1px solid var(--line-2); border-radius:8px; overflow:hidden; }
  .seg { background:transparent; border:none; color:var(--muted); font-family:inherit; font-size:12px; font-weight:600; padding:7px 12px; cursor:pointer; }
  .seg:hover { color:var(--text); }
  .seg.on { background:color-mix(in srgb,var(--accent) 18%,transparent); color:var(--accent); }
  .chart-wrap { position:relative; }
  .chart-wrap svg { width:100%; height:auto; max-height:200px; display:block; }
  .chart-txt { font-size:10px; fill:var(--muted); }
  .chart-legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; font-size:11px; color:var(--muted); }
  .lg { display:inline-flex; align-items:center; gap:5px; }
  .lg i { width:8px; height:8px; border-radius:999px; display:inline-block; }

  /* ================================================================ responsive */
  @media (max-width:900px){
    .sidebar { transform:translateX(-100%); transition:transform .2s ease; }
    .sidebar.open { transform:none; box-shadow:0 0 0 100vmax rgba(5,10,20,.6); }
    .menu-btn { display:grid; }
    .main-col { margin-left:0; }
    .dash-grid { grid-template-columns:1fr; }
    main { padding:16px; }
    .topbar { padding:12px 16px; }
    .topbar .page-desc p { display:none; }
  }
</style>
</head>

<script>
const app = document.getElementById('app');
let view = 'dashboard';

// Performance tab state (Phase A): selected agent id + range; auto-refresh timer.
let perfAgent = null;
let perfRange = '1h';
let perfTimer = null;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

const ic = name => `<svg class="ic" aria-hidden="true"><use href="#ic-${name}"/></svg>`;

function sevBadge(s) {
  return `<span class="badge ${s === 'critical' ? 'off' : s === 'warning' ? 'warn' : 'info'}">${esc(s)}</span>`;
}

function statCardsEl(cards) {
  const el = document.getElementById('statcards');
  if (!el) return;
  el.innerHTML = (cards && cards.length)
    ? cards.map(c => `<div class="stat" data-tone="${esc(c.tone || 'accent')}">
        <div class="s-ic">${ic(c.icon || 'bar-chart')}</div>
        <div class="s-kind">
          <div class="s-val">${esc(c.value)}</div>
          <div class="s-lab">${esc(c.label)}</div>
          ${c.sub ? `<div class="s-sub">${esc(c.sub)}</div>` : ''}
        </div>
      </div>`).join('')
    : '';
}

const VIEW_META = {
  dashboard: ['Dashboard', 'Fleet health, open alerts and recent activity', 'dashboard'],
  agents: ['Agents', 'Registered agents and check-in status', 'devices'],
  fleet: ['Fleet', 'Cross-fleet disk, battery, update and health posture', 'layers'],
  events: ['Events', 'Sanitized telemetry captured from agents', 'activity'],
  commands: ['Commands', 'Issue reboot / wake / run-script and track delivery', 'terminal'],
  alerts: ['Alerts', 'Open, acknowledged and resolved alerts · delivery channels', 'bell'],
  software: ['Software', 'Installed-application inventory search and license compliance', 'app-window'],
  performance: ['Performance', 'Per-agent real-time CPU / RAM / disk / network / GPU / battery graphs', 'bar-chart'],
  reports: ['Reports', 'Fleet and per-agent CSV / JSON export', 'file-text'],
  features: ['Features', 'Enable, disable and configure collector modules', 'sliders'],
  users: ['Users', 'Team accounts, roles and companies / tenants', 'users'],
  agent: ['Agent Setup', 'Company bundle, MSI build and rollout target', 'download'],
  deploy: ['Deploy Guide', 'Agent rollout: MSI-only vs full bundle, step by step', 'package'],
};

function updatePageHeader(v) {
  const m = VIEW_META[v] || VIEW_META.agents;
  const t = document.getElementById('pageTitle');
  const s = document.getElementById('pageSubtitle');
  if (t) t.innerHTML = ic(m[2]) + esc(m[0]);
  if (s) s.textContent = m[1];
}

function gotoView(v) {
  view = v;
  document.querySelectorAll('nav button').forEach(x => {
    const on = x.dataset.view === v;
    x.classList.toggle('active', on);
    if (on) x.setAttribute('aria-current', 'page'); else x.removeAttribute('aria-current');
  });
  const sb = document.getElementById('header');
  if (sb) sb.classList.remove('open');
  render();
}

function toggleSidebar() { document.getElementById('header').classList.toggle('open'); }

function pruneNavGroups() {
  document.querySelectorAll('nav .nav-label').forEach(l => {
    let g = l.nextElementSibling, any = false;
    while (g && !(g.classList && g.classList.contains('nav-label'))) {
      if (g.tagName === 'BUTTON' && g.style.display !== 'none') any = true;
      g = g.nextElementSibling;
    }
    l.style.display = any ? '' : 'none';
  });
}

async function checkIngestStatus() {
  const el = document.getElementById('ingestBanner');
  if (!el) return;
  try {
    const r = await fetch('/api/status');
    if (!r.ok) return;
    const d = await r.json();
    if (d.last_ingest_error) {
      el.innerHTML = `${ic('alert-triangle')} <span>Last ingest failed: ${esc(d.last_ingest_error)}</span> <button class="dismiss" onclick="this.parentElement.style.display='none'" aria-label="Dismiss">${ic('x')}</button>`;
      el.style.display = 'flex';
    } else el.style.display = 'none';
  } catch {}
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401) { startAuthFlow(); return null; }
  if (!res.ok) { app.innerHTML = `<p class="muted">Error ${res.status}: ${esc((await res.json()).detail ?? '')}</p>`; return null; }
  return res.json();
}

function applyBranding(b) {
  if (b && b.color) document.documentElement.style.setProperty('--accent', b.color);
  const c = document.getElementById('company');
  c.textContent = b && b.logo_text ? b.logo_text : (b && b.company) || 'IT-Toolkit';
  document.title = (b && b.logo_text) ? b.logo_text + ' — IT-Toolkit' : 'IT-Toolkit Enterprise';
}

// ---------------------------------------------------------------- flow

async function start() {
  const status = await fetch('/api/setup/status').then(r => r.json()).catch(() => ({ setup_complete: false }));
  window.__defaultBuildMode = status.default_build_mode || 'manual';
  if (!status.setup_complete) return renderSetup();
  let boot;
  try {
    const res = await fetch('/api/bootstrap');
    if (!res.ok) throw new Error(res.status);
    boot = await res.json();
  } catch { return renderLogin(); }
  window.boot = boot;
  window.user = boot.user;
  applyBranding(boot);
  document.body.classList.remove('auth');
  document.getElementById('header').style.display = 'flex';
  document.getElementById('who').textContent = boot.user ? boot.user.username : '';
  document.getElementById('whoRole').textContent =
    (boot.user ? boot.user.role : '')
    + (boot.company && boot.company.name ? ' · ' + boot.company.name : '');
  const av = document.getElementById('whoAvatar');
  if (av) av.textContent = boot.user && boot.user.username ? boot.user.username[0] : '?';
  setupNav();
  pruneNavGroups();
  refreshAlertBadge();
  setInterval(refreshAlertBadge, 30000);
  checkIngestStatus();
  setInterval(checkIngestStatus, 60000);
  render();
}

async function refreshAlertBadge() {
  try {
    const r = await fetch('/api/alerts/open');
    if (!r.ok) return;
    const d = await r.json();
    const badge = document.getElementById('alertBadge');
    if (d.open > 0) { badge.textContent = d.open; badge.style.display = 'inline'; }
    else badge.style.display = 'none';
  } catch {}
}

function setupNav() {
  const isAdmin = window.user && window.user.role === 'admin';
  const canAgentSetup = window.user && (window.user.role === 'admin' || window.user.role === 'operation');
  document.querySelectorAll('nav button').forEach(b => {
    if (b.dataset.view === 'users') b.style.display = isAdmin ? '' : 'none';
    if (b.dataset.view === 'agent' || b.dataset.view === 'deploy') b.style.display = canAgentSetup ? '' : 'none';
  });
}

// ---------------------------------------------------------------- setup wizard

function renderSetup() {
  const host = window.location.hostname || 'localhost';
  app.innerHTML = `
    <div class="center card">
      <h2>IT-Toolkit Enterprise setup</h2>
      <p class="muted">First-time configuration — done once on the server. Certs and secrets are generated here and kept on this machine.</p>
      <label>Company name</label><input id="company_name" placeholder="Acme Inc." />
      <label>Server address (used for agent connections)</label><input id="server_host" value="${esc(host)}" />
      <div class="row">
        <div style="flex:1"><label>Admin username</label><input id="admin_username" value="admin" /></div>
        <div style="flex:1"><label>Brand color</label><input id="branding_color" type="color" value="#38bdf8" style="padding:2px;height:38px" /></div>
      </div>
      <label>Admin password (min 8 chars)</label><input id="admin_password" type="password" />
      <label>Repeat password</label><input id="admin_password2" type="password" />

      <div style="margin-top:22px;border-top:1px solid var(--line);padding-top:8px">
        <label style="font-size:14px;color:var(--text);font-weight:600">Alert email (SMTP) — optional</label>
        <p class="muted">Send alert notifications by email. Pick your hosting provider or use custom settings.</p>
        <label>Email provider</label>
        <select id="smtp_provider" onchange="smtpProviderChange()">
          <option value="none">Don't send email alerts</option>
          <option value="hostinger">Hostinger</option>
          <option value="office365">Office 365</option>
          <option value="gmail">Gmail</option>
          <option value="hotmail">Hotmail / Outlook</option>
          <option value="custom">Custom SMTP</option>
        </select>
        <div id="smtp_fields" style="display:none">
          <label>Email address</label><input id="smtp_email" value="it-tool@aaditechs.in" />
          <label>Email password (or app password)</label><input id="smtp_password" type="password" />
          <label>Alert recipient (defaults to the email above)</label><input id="smtp_recipient" value="it-tool@aaditechs.in" />
          <div id="smtp_custom" style="display:none">
            <div class="row">
              <div style="flex:2"><label>SMTP host</label><input id="smtp_host" placeholder="smtp.example.com" /></div>
              <div style="flex:1"><label>Port</label><input id="smtp_port" value="587" /></div>
            </div>
            <label>Encryption</label>
            <select id="smtp_encryption">
              <option value="starttls">STARTTLS</option>
              <option value="ssl">SSL/TLS</option>
              <option value="none">None</option>
            </select>
          </div>
        </div>
      </div>

      <div style="margin-top:22px;border-top:1px solid var(--line);padding-top:8px">
        <label style="font-size:14px;color:var(--text);font-weight:600">Agent MSI build</label>
        <p class="muted">How the Windows agent installer gets built. Windows Server builds locally (fully automatic). A Linux server can trigger this repo's GitHub Actions and pull the signed MSI back automatically.</p>
        <select id="build_mode" onchange="buildModeChange()">
          <option value="local_windows">Windows Server — build locally here (automatic)</option>
          <option value="github">GitHub Actions — remote build (Linux server)</option>
          <option value="manual">Manual — I'll build/upload the MSI myself</option>
        </select>
        <div id="github_fields" style="display:none">
          <label>GitHub repo (owner/repo)</label><input id="github_repo" placeholder="j9619655391-max/Aaditech-ToolKit" />
          <label>Personal access token (PAT — needs actions:write + actions:read)</label><input id="github_token" type="password" placeholder="ghp_..." />
          <p class="muted">After setup, the Agent Setup page can trigger the build and download the MSI. Create a PAT at github.com → Settings → Developer settings → Personal access tokens → fine-grained (repo + actions) with Actions: Read/Write.</p>
        </div>
      </div>

      <div class="error" id="setup_err"></div>
      <div style="margin-top:18px"><button class="action" style="width:100%" onclick="doSetup()">Finish setup</button></div>
    </div>`;
  const sel = document.getElementById('build_mode');
  if (sel) {
    if (window.__defaultBuildMode && sel.querySelector(`option[value="${esc(window.__defaultBuildMode)}"]`)) {
      sel.value = window.__defaultBuildMode;
    }
    buildModeChange();
  }
}

function smtpProviderChange() {
  const p = document.getElementById('smtp_provider').value;
  const custom = p === 'custom';
  document.getElementById('smtp_fields').style.display = p === 'none' ? 'none' : 'block';
  document.getElementById('smtp_custom').style.display = custom ? 'block' : 'none';
}

function buildModeChange() {
  const m = document.getElementById('build_mode').value;
  document.getElementById('github_fields').style.display = m === 'github' ? 'block' : 'none';
}

async function doSetup() {
  const err = document.getElementById('setup_err');
  const p1 = document.getElementById('admin_password').value;
  const p2 = document.getElementById('admin_password2').value;
  if (p1.length < 8) { err.textContent = 'Password must be at least 8 characters.'; return; }
  if (p1 !== p2) { err.textContent = 'Passwords do not match.'; return; }
  const provider = document.getElementById('smtp_provider').value;
  const smtp = { provider };
  if (provider !== 'none') {
    smtp.email = document.getElementById('smtp_email').value.trim();
    smtp.password = document.getElementById('smtp_password').value;
    smtp.recipient = document.getElementById('smtp_recipient').value.trim();
    if (provider === 'custom') {
      smtp.host = document.getElementById('smtp_host').value.trim();
      smtp.port = parseInt(document.getElementById('smtp_port').value, 10) || null;
      smtp.encryption = document.getElementById('smtp_encryption').value;
    }
  }
  const body = {
    company_name: document.getElementById('company_name').value.trim(),
    server_host: document.getElementById('server_host').value.trim(),
    admin_username: document.getElementById('admin_username').value.trim(),
    admin_password: p1,
    branding: { color: document.getElementById('branding_color').value, logo_text: document.getElementById('company_name').value.trim() },
    smtp,
    build_mode: document.getElementById('build_mode').value,
    github_repo: document.getElementById('github_repo').value.trim(),
    github_token: document.getElementById('github_token').value.trim(),
  };
  const res = await fetch('/api/setup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) { err.textContent = (await res.json()).detail || 'Setup failed'; return; }
  const data = await res.json();
  if (data.session_secret) return renderSecretBackup(data.session_secret);
  start();
}

function renderSecretBackup(secret) {
  const blob = new Blob([secret + '\n'], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  app.innerHTML = `
    <div class="center card">
      <h2>Setup complete — save your encryption key</h2>
      <p class="muted">This key encrypts stored secrets (SMTP password, GitHub token) and signs login sessions.
      It is shown <b>only once</b>. Download it now — you'll need it to restore this server from a backup.
      Treat it like a password: anyone with it can decrypt your stored secrets.</p>
      <div style="margin:14px 0;padding:10px;background:#0a101f;border:1px solid var(--line-2);border-radius:8px;font-family:monospace;word-break:break-all;font-size:13px">${esc(secret)}</div>
      <div class="row" style="align-items:flex-end;gap:10px">
        <a class="action" style="flex:1;text-align:center" href="${url}" download="itk-session-secret.txt">Download key file</a>
        <button class="action" style="flex:1" onclick="copySecret('${esc(secret)}', this)">Copy</button>
      </div>
      <div style="margin-top:18px"><button class="action" style="width:100%" onclick="start()">Continue to dashboard</button></div>
    </div>`;
}

function copySecret(secret, btn) {
  navigator.clipboard.writeText(secret).then(() => { btn.textContent = 'Copied'; }).catch(() => {});
}

// ---------------------------------------------------------------- login

function renderLogin() {
  app.innerHTML = `
    <div class="center card">
      <h2>Sign in</h2>

function latestByHost(events) {
  const m = {};
  for (const e of events || []) {
    const t = new Date(e.captured_at).getTime();
    if (!m[e.hostname] || t > m[e.hostname].t) m[e.hostname] = { e, t };
  }
  return Object.values(m).map(x => x.e);
}

// ---------------------------------------------------------------- performance (Phase A)

function openPerf(agentId) {
  perfAgent = String(agentId);
  gotoView('performance');
}

function schedulePerfRefresh() {
  if (perfTimer) clearTimeout(perfTimer);
  if (view !== 'performance') return;
  perfTimer = setTimeout(() => { if (view === 'performance') renderPerformance(); }, 15000);
}

const perfColors = ['var(--accent)', '#0ea5e9', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6', '#14b8a6', '#f97316'];

function perfSeries(avg, key) {
  if (!avg || typeof avg[key] !== 'number' || !isFinite(avg[key])) return null;
  return avg[key];
}

function chartCard(title, seriesList, unit, points) {
  // seriesList: [{key, label, color}] drawn against the shared time axis of
  // `points` (each {ts, avg, max, min}).
  const W = 900, H = 190, PAD = 8;
  let all = [];
  seriesList.forEach((s, si) => {
    s.points = points.map(p => perfSeries(p.avg, s.key)).map((v, i) => ({ i, v: v == null ? null : v }));
    all = all.concat(s.points.filter(p => p.v != null).map(p => p.v));
    if (s.points.every(p => p.v == null) && !(si === 0 && seriesList.length === 1)) s.hidden = true;
  });
  if (all.length === 0) {
    return `<div class="card"><h3>${esc(title)}</h3><p class="muted">No ${esc(unit)} data yet — the agent starts streaming after it next checks in with metrics enabled.</p></div>`;
  }
  let mn = Math.min(...all), mx = Math.max(...all);
  if (mn === mx) { mn -= 1; mx += 1; }
  const span = mx - mn || 1;
  const inner = p => p.v == null ? null : (PAD + (H - 2 * PAD) * (1 - (p.v - mn) / span));
  const xp = i => PAD + (points.length <= 1 ? 0 : (W - 2 * PAD) * i / Math.max(1, points.length - 1));
  const n = seriesList.filter(s => !s.hidden).length;
  const polys = seriesList.map((s, si) => {
    if (s.hidden) return '';
    const pts = s.points.map(p => (inner(p) == null ? '' : `${xp(p.i)},${inner(p).toFixed(1)}`)).filter(Boolean).join(' ');
    const y0 = (maxAt) => PAD + (H - 2 * PAD) * (1 - (maxAt - mn) / span);
    let path = '';
    s.points.forEach((p, j) => {
      const y = inner(p);
      if (y == null) return;
      path += (j === 0 ? `M${xp(p.i)},${y.toFixed(1)}` : `L${xp(p.i)},${y.toFixed(1)}`);
    });
    return `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2" opacity="0.9"/>` +
      `<path d="M${xp(0)},${y0(mn)}H${xp(points.length ? points.length - 1 : 0)}" stroke="currentColor" stroke-opacity="0.15" stroke-width="1"/>`;
  }).join('');
  const mid = Math.round((mn + mx) / 2);
  const legend = seriesList.filter(s => !s.hidden).map(s =>
    `<span class="lg"><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join('');
  const last = points.length ? points[points.length - 1] : null;
  return `<div class="card"><h3>${esc(title)} <span class="badge info">${esc(unit)}</span></h3>
    <div class="chart-wrap">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(title)} graph">
        <line x1="${PAD}" y1="${PAD}" x2="${W - PAD}" y2="${PAD}" stroke="currentColor" stroke-opacity="0.1"/>
        <line x1="${PAD}" y1="${H - PAD}" x2="${W - PAD}" y2="${H - PAD}" stroke="currentColor" stroke-opacity="0.1"/>
        <text x="${PAD + 2}" y="${PAD - 4}" class="chart-txt">${fmtNum(mx)}</text>
        <text x="${PAD + 2}" y="${H - PAD + 14}" class="chart-txt">${fmtNum(mn)}</text>
        <text x="${PAD + 2}" y="${H / 2 + 4}" class="chart-txt">${fmtNum(mid)}</text>
        <text x="${W - PAD}" y="${H - PAD + 14}" class="chart-txt" text-anchor="end">${last ? new Date(last.ts).toLocaleString() : ''}</text>
        ${polys}
      </svg>
      <div class="chart-legend">${legend}</div>
    </div></div>`;
}

function fmtNum(v) {
  if (v == null || !isFinite(v)) return '—';
  if (Math.abs(v) >= 1e9) return (v / 1e9).toFixed(1) + 'G';
  if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return Math.round(v).toString();
}

function diskChartCards(points) {
  // one card per drive, using its disk_used_pct:<drive> series
  const keys = [...new Set(points.flatMap(p => p.avg ? Object.keys(p.avg) : [])
    .filter(k => k.startsWith('disk_used_pct:')))];
  return keys.map((k, i) => chartCard(`Disk ${k.split(':')[1]}`, [{ key: k, label: 'Used %', color: perfColors[i % perfColors.length] }], '%', points)).join('');
}

function netChartCard(points) {
  // per-interface download/upload in Mbps (converted from bytes/sec)
  const suff = [...new Set(points.flatMap(p => p.avg ? Object.keys(p.avg) : [])
    .filter(k => k.startsWith('net_rx_bps:'))
    .map(k => k.split(':')[1]))];
  if (!suff.length) return '';
  const cards = suff.slice(0, 4).map((s, i) => {
    const Mbps = (k, v) => v == null ? null : v / (1024 * 1024);
    const pts = points.map(p => ({ ts: p.ts, avg: {}, max: {}, min: {} }));
    // re-map to a Mbps view via a custom series extractor by temporarily scaling
    const keyR = `net_rx_bps:${s}`, keyT = `net_tx_bps:${s}`;
    const scaled = points.map(p => ({ ts: p.ts, avg: {
      __rx: Mbps(keyR, perfSeries(p.avg, keyR)),
      __tx: Mbps(keyT, perfSeries(p.avg, keyT)),
    }, max: {}, min: {} }));
    return chartCard(`Network ${s}`, [
      { key: '__rx', label: '↓ Download Mbps', color: '#0ea5e9' },
      { key: '__tx', label: '↑ Upload Mbps', color: '#f59e0b' },
    ], 'Mbps', scaled);
  }).join('');
  return cards;
}

async function renderPerformance() {
  const agents = await api('/api/agents');
  if (!agents) return;
  if (!perfAgent || !agents.some(a => String(a.id) === perfAgent)) perfAgent = agents.length ? String(agents[0].id) : null;
  const opts = agents.map(a => `<option value="${a.id}" ${String(a.id) === perfAgent ? 'selected' : ''}>${esc(a.hostname)}</option>`).join('');
  const rangeBtns = ['1h', '24h', '7d', '30d'].map(r =>
    `<button class="seg ${perfRange === r ? 'on' : ''}" onclick="perfRange='${r}'; renderPerformance()">${r}</button>`).join('');

  if (!perfAgent) {
    app.innerHTML = `<div class="card"><h3>Performance</h3><p class="muted">No agents yet — install the agent to start streaming metrics. See Agent Setup.</p></div>`;
    statCardsEl([]);
    schedulePerfRefresh();
    return;
  }

  const [series, latest] = await Promise.all([
    api(`/api/agents/${perfAgent}/metrics?range=${perfRange}`),
    api(`/api/agents/${perfAgent}/metrics/latest`),
  ]);
  const data = series && series.points ? series.points : [];
  const payload = latest ? latest.payload : {};

  const cards = document.createElement('div');
  cards.id = 'perfCards';
  app.innerHTML = `
    <div class="card" style="padding-bottom:10px">
      <div class="perf-controls">
        <label>Agent
          <select id="perfAgentSel" onchange="perfAgent=this.value; renderPerformance()">${opts}</select>
        </label>
        <div class="seg-group">${rangeBtns}</div>
        <button class="action" onclick="renderPerformance()">Refresh now</button>
      </div>
      <p class="muted">Samples stream from the agent every minute by default (metrics_interval_seconds). Long windows read downsampled hour/day buckets.</p>
    </div>
    <div id="perfCards">
      ${chartCard('CPU', [{ key: 'cpu', label: '% Kernel+User', color: perfColors[0] }], '%', data)}
      ${chartCard('Memory', [{ key: 'mem_pct', label: 'Used %', color: perfColors[1] }], '%', data)}
      ${diskChartCards(data)}
      ${netChartCard(data)}
      ${('gpu_util' in (payload || {}) ? chartCard('GPU', [{ key: 'gpu_util', label: 'Utilization', color: perfColors[4] }], '%', data) : '')}
      ${('battery_pct' in (payload || {}) ? chartCard('Battery', [{ key: 'battery_pct', label: 'Charge %', color: perfColors[2] }], '%', data) : '')}
      ${data.length ? '' : '<div class="card"><h3>No samples yet</h3><p class="muted">No metrics received in this window — the agent must check in with the metrics collector enabled.</p></div>'}
    </div>`;

  statCardsEl([
    { icon: 'cpu', label: 'CPU', value: payload && payload.cpu != null ? payload.cpu + '%' : '—', tone: 'accent' },
    { icon: 'layers', label: 'RAM', value: payload && payload.mem_pct != null ? payload.mem_pct + '%' : '—', tone: 'info' },
    { icon: 'hard-drive', label: 'Disk worst', value: worstDisk(payload) + '%', tone: 'accent' },
    { icon: 'activity', label: 'Net ↑↓', value: netTotal(payload) + ' Mbps', tone: 'good' },
    { icon: 'battery', label: 'Battery', value: payload && payload.battery_pct != null ? payload.battery_pct + '%' : '—', tone: 'good' },
  ]);
  schedulePerfRefresh();
}

function worstDisk(payload) {
  if (!payload || !Array.isArray(payload.disks) || !payload.disks.length) return '—';
  return Math.max(...payload.disks.filter(d => d && d.used_pct != null).map(d => d.used_pct));
}

function netTotal(payload) {
  if (!payload || !Array.isArray(payload.net) || !payload.net.length) return 0;
  const mb = payload.net.reduce((s, n) => s + (n.rx_bps || 0) + (n.tx_bps || 0), 0);
  return (mb / (1024 * 1024)).toFixed(1);
}

function cmdKind() {
  const k = document.getElementById('cmd_kind').value;
  const f = document.getElementById('cmd_fields');
  if (k === 'reboot') {
    f.innerHTML = '<label>Delay (seconds)</label><input id="cmd_delay" type="number" value="0" min="0" />';
  } else if (k === 'wake') {
    f.innerHTML = '<label>MAC</label><input id="cmd_mac" placeholder="AA:BB:CC:DD:EE:FF" /><label>IP (optional)</label><input id="cmd_ip" placeholder="255.255.255.255" />';
  } else {
    f.innerHTML = '<label>Script (path relative to install root)</label><input id="cmd_script" placeholder="Scripts/QuickCheck.ps1" />';
  }
}

async function issueCmd() {
  const err = document.getElementById('cmd_err');
  const k = document.getElementById('cmd_kind').value;
  const payload = {};
  if (k === 'reboot') payload.delay_seconds = parseInt(document.getElementById('cmd_delay').value || '0', 10);
  else if (k === 'wake') {
    payload.mac = document.getElementById('cmd_mac').value.trim();
    payload.ip = document.getElementById('cmd_ip').value.trim();
  } else {
    payload.script = document.getElementById('cmd_script').value.trim();
  }
  const body = {
    agent_id: parseInt(document.getElementById('cmd_agent').value, 10),
    kind: k,
    payload,
  };
  const res = await api('/api/commands', { method: 'POST', body: JSON.stringify(body) });
  if (res) renderCommands();
}

        <div><button class="action" onclick="addUser()">Create</button></div>
      </div>
      <div class="error" id="users_err"></div>
    </div>
    <div class="card"><h3>Companies / tenants</h3>
      <p class="muted">Agents and users belong to a company. New agents enroll into the default company; list queries are scoped to the signed-in user's company.</p>
      <table><thead><tr><th>Company</th><th>Users</th><th>Agents</th><th></th></tr></thead>
      <tbody>${(companies || []).map(c => `
        <tr>
          <td>${esc(c.name)} ${c.id === (defaultCompany && defaultCompany.company_id) ? '<span class="badge on">default</span>' : ''}</td>
          <td>${c.users}</td><td>${c.agents}</td>
          <td><button class="ghost" onclick="setDefaultCompany('${esc(c.name)}')">Make default</button></td>
        </tr>`).join('') || '<tr><td colspan="4" class="muted">No companies yet.</td></tr>'}</tbody></table>
      <div class="row" style="align-items:flex-end;margin-top:10px">
        <div style="flex:2"><label>New company name</label><input id="nc_name" /></div>
        <div><button class="action" onclick="addCompany()">Create company</button></div>
      </div>
      <div class="error" id="companies_err"></div>
    </div>`;
  const active = data.filter(u => u.active).length;
  statCardsEl([
    { icon: 'users', label: 'Users', value: data.length, tone: 'accent' },
    { icon: 'check', label: 'Active', value: active, tone: 'good' },
    { icon: 'x-circle', label: 'Disabled', value: data.length - active, tone: (data.length - active) ? 'warn' : 'good' },
    { icon: 'briefcase', label: 'Companies', value: (companies || []).length, tone: 'info' },
  ]);
}

async function addCompany() {
  const err = document.getElementById('companies_err');
  const name = document.getElementById('nc_name').value.trim();
  if (!name) { err.textContent = 'Company name is required.'; return; }
  const r = await api('/api/companies', { method: 'POST', body: JSON.stringify({ name }) });
  if (r) { err.textContent = ''; renderUsers(); }
}

async function setDefaultCompany(name) {
  await api('/api/settings/default-company', { method: 'POST', body: JSON.stringify({ name }) });
  renderUsers();
}

async function addUser() {
  const err = document.getElementById('users_err');
  const body = {
    username: document.getElementById('nu_user').value.trim(),
    password: document.getElementById('nu_pass').value,
    role: document.getElementById('nu_role').value,
  };
  if (body.username.length < 3) { err.textContent = 'Username must be at least 3 characters.'; return; }
  if (body.password.length < 8) { err.textContent = 'Password must be at least 8 characters.'; return; }
  const r = await api('/api/users', { method: 'POST', body: JSON.stringify(body) });
  if (r) renderUsers();
}

async function promptReset(id, username) {
  const pw = prompt('New password for ' + username + ' (min 8 chars):');
  if (!pw) return;
  if (pw.length < 8) { alert('Password too short'); return; }
  const r = await api('/api/users/' + id, { method: 'PUT', body: JSON.stringify({ password: pw }) });
  if (r) alert('Password updated for ' + username);
}

async function toggleActive(id, active) {
  const r = await api('/api/users/' + id, { method: 'PUT', body: JSON.stringify({ active }) });
  if (r) renderUsers();
}

async function changeRole(id, role) {
  const r = await api('/api/users/' + id, { method: 'PUT', body: JSON.stringify({ role }) });
  if (r) renderUsers();
}

// ---------------------------------------------------------------- agent setup / bundle

async function renderAgentSetup() {
  const data = await api('/api/agent-bundle');
  if (!data) return;
  const caLink = data.ca_cert
    ? `<a href="/api/ca.crt" class="action" style="text-decoration:none;display:inline-block;margin-right:8px">Download CA (.crt)</a>` : '';
  const msiBlock = data.msi_available
    ? `<a href="${esc(data.msi_url)}" class="action" style="text-decoration:none;display:inline-block;margin-right:8px">Download MSI (${(data.msi_size/1048576).toFixed(1)} MB)</a>`
    : '<span class="badge off">MSI not published yet</span> <span class="muted">— becomes available once the agent is built (Windows Server local build, or GitHub remote build below).</span>';
  const build = await api('/api/build/status').catch(() => null);
  app.innerHTML = `
    <div class="card"><h3>Company agent package</h3>
      <p class="muted">These three files make up the company bundle. Hand them out on a USB / Intranet share, or push the MSI via Intune / GPO / SCCM and drop <code>agent.json</code> + <code>ca.crt</code> into <code>C:\\ProgramData\\ITToolkit-Agent\\</code>.</p>
      <div class="row" style="flex-wrap:wrap;margin-top:10px">
        <a href="/api/agent/agent.json" class="action" style="text-decoration:none;display:inline-block;margin-right:8px">Download agent.json</a>
        ${caLink}
        <a href="/api/agent/install.cmd" class="action" style="text-decoration:none;display:inline-block;margin-right:8px">Download install-agent.cmd</a>
        ${msiBlock}
      </div>
      <p class="muted" style="margin-top:10px">Company: <code>${esc(data.company)}</code> · Server: <code>${esc(data.server_host)}</code> · Scheme: <code>${esc(data.scheme)}</code></p>
      <label>Endpoint</label>
      <div class="code">${esc(data.agent_json.endpoint)}</div>
      <label>Agent token (keep secret — ships inside agent.json)</label>
      <div class="code">${esc(data.agent_json.token)}</div>
      <label>Self-update: rollout target version (empty = bundled ${esc(data.agent_json.agent_version)})</label>
      <div class="row" style="margin-top:4px">
        <input id="agent-rollout" type="text" value="${esc(data.rollout_target || '')}" placeholder="e.g. 1.1.0" style="flex:1;margin-right:8px">
        <button class="action" onclick="setRolloutTarget()">Save target</button>
      </div>
      <p class="muted" style="margin-top:6px">Agents with a lower installed version will silently upgrade on their next cycle.</p>
    </div>
    <div class="card"><h3>Agent MSI build</h3>
      ${build ? renderBuildPanel(build) : '<span class="muted">Build status unavailable.</span>'}
    </div>
    <div class="card"><h3>install-agent.cmd (generated live)</h3>
      <p class="muted">Installs the MSI, then writes the company <code>agent.json</code> + <code>ca.crt</code> over the bundled template.</p>
      <pre>${esc(data.install_cmd)}</pre>
    </div>
    <div class="card"><h3>agent.json preview</h3>
      <pre>${esc(JSON.stringify(data.agent_json, null, 2))}</pre>
    </div>`;
}

async function setRolloutTarget() {
  const v = document.getElementById('agent-rollout')?.value?.trim() || '';
  const r = await api('/api/agent/update-target', { method: 'PUT', body: JSON.stringify({ target_version: v }) });
  if (r) renderAgentSetup();
}

async function renderDeploy() {
  const [bundle, build] = await Promise.all([
    api('/api/agent-bundle'),
    api('/api/build/status').catch(() => null),
  ]);
  if (!bundle) return;
  const a = bundle.agent_json || {};
  const msiState = bundle.msi_available
    ? `<span class="badge ok">MSI published (${(bundle.msi_size / 1048576).toFixed(1)} MB)</span>`
    : `<span class="badge off">MSI not built yet — see "Build the MSI" below</span>`;
  const fileList = bundle.ca_cert ? 'MSI, agent.json, ca.crt, install-agent.cmd' : 'MSI, agent.json, install-agent.cmd';
  const caLink = bundle.ca_cert
    ? `<a href="/api/ca.crt" class="action" style="text-decoration:none;display:inline-block;margin-right:8px">${ic('shield')} ca.crt</a>` : '';
  const msiLink = bundle.msi_available
    ? `<a href="${esc(bundle.msi_url)}" class="action" style="text-decoration:none;display:inline-block;margin-right:8px">${ic('package')} MSI (${(bundle.msi_size / 1048576).toFixed(1)} MB)</a>` : '';
  app.innerHTML = `
    <div class="card"><h3>${ic('server')} Server config</h3>
      <p class="muted">This is what every installed agent connects to. If the server IP / domain ever changes, just re-generate the bundle and re-run <code>install-agent.cmd</code> — the MSI does not need to be reinstalled.</p>
      <label>Company</label>
      <div class="code">${esc(bundle.company)}</div>
      <label>Ingest endpoint (agent → server)</label>
      <div class="code">${esc(a.endpoint || '—')}</div>
      <label>Enroll URL (auto mTLS client-cert + CA)</label>
      <div class="code">${esc(a.enroll_url || '—')}</div>
      <div class="row" style="flex-wrap:wrap;margin-top:10px">${msiState} ${build ? `<span class="badge">build mode: ${esc(build.mode || 'manual')}</span>` : ''}</div>
    </div>

    <div class="card"><h3>${ic('package')} Option A — MSI only (easiest)</h3>
      <p class="muted">Use this when the MSI was built by <em>this</em> server — its <code>agent.json</code> is baked in with the endpoint, token and enroll URL above. Deploy just the MSI via Intune / GPO / SCCM, or install silently:</p>
      <ol class="steps">
        <li><code>msiexec /i IT-Toolkit-Agent.msi /qn</code></li>
        <li>First scheduled run auto-enrolls the mTLS client certificate and installs the server CA into the LocalMachine Root — no manual <code>ca.crt</code> copy needed.</li>
        <li>Verify: the machine shows up under <strong>Agents</strong> within one interval (default ${esc(a.interval_minutes || 30)} min).</li>
      </ol>
    </div>

    <div class="card"><h3>${ic('briefcase')} Option B — Full bundle (guaranteed)</h3>
      <p class="muted">Recommended for USB / intranet shares, generic MSIs, or after a server address change. Download every file into one folder on the target and run <code>install-agent.cmd</code> as Administrator — it installs the MSI, then overwrites <code>agent.json</code> + <code>ca.crt</code> with this server's values and writes the endpoint into the registry.</p>
      <div class="row" style="flex-wrap:wrap;margin:10px 0">
        <a href="/api/agent/agent.json" class="action" style="text-decoration:none;display:inline-block;margin-right:8px">${ic('file-text')} agent.json</a>
        ${caLink}
        <a href="/api/agent/install.cmd" class="action" style="text-decoration:none;display:inline-block;margin-right:8px">${ic('download')} install-agent.cmd</a>
        ${msiLink}
      </div>
      <ol class="steps">
        <li>Copy ${esc(fileList)} into one folder on the target machine.</li>
        <li>Run <code>install-agent.cmd</code> as Administrator (double-click, or push silently via Intune / GPO / SCCM).</li>
        <li>Manual fallback without the cmd: install the MSI, then copy <code>agent.json</code> + <code>ca.crt</code> into <code>C:\\ProgramData\\ITToolkit-Agent\\</code>.</li>
      </ol>
      <p class="muted" style="margin-top:8px">GPO tip: fleet-wide override is possible via <code>HKLM\\SOFTWARE\\ITToolkit\\Agent\\EndpointUrl</code>.</p>
    </div>

    <div class="card"><h3>${ic('info')} Build the MSI</h3>
      ${build ? renderBuildPanel(build) : '<span class="muted">Build status unavailable.</span>'}
      <p class="muted" style="margin-top:8px">Windows Server: <code>pwsh ./Enterprise/deploy/deploy.ps1</code> auto-builds, signs and publishes. Linux server: use the GitHub Actions build from <strong>Agent Setup</strong>. Manual: run <code>build-agent.ps1</code> then <code>build-msi.ps1</code> on a Windows machine and upload the MSI into the server's <code>agent_artifacts</code> volume.</p>
    </div>`;
}

function renderBuildPanel(build) {
  const mode = build.mode || 'manual';
  let body;
  if (mode === 'local_windows') {
    body = `<p class="muted">This server builds the agent locally (Windows Server). Run <code>pwsh ./Enterprise/deploy/deploy.ps1</code> on the server — it auto-builds, signs and publishes the MSI. If the MSI is already available above, nothing to do.</p>`;
  } else if (mode === 'github') {
    const gh = build.github || {};
    const stateBadge = gh.error
      ? `<span class="badge off">${esc(gh.error)}</span>`
      : (gh.conclusion === 'success'
          ? `<span class="badge ok">build succeeded</span>`
          : (gh.conclusion === 'failure'
              ? `<span class="badge off">build failed</span>`
              : (gh.state === 'in_progress' || gh.state === 'queued'
                  ? `<span class="badge warn">build ${esc(gh.state)}…</span>`
                  : `<span class="badge">no build yet</span>`)));
    body = `
      <p class="muted">Remote build via GitHub Actions on <code>${esc(build.github_repo || '—')}</code>.</p>
      <p>Status: ${stateBadge} ${gh.run_number ? `#${esc(gh.run_number)}` : ''} ${gh.html_url ? `(<a href="${esc(gh.html_url)}" target="_blank">run</a>)` : ''}</p>
      <div style="margin-top:10px">
        <button class="action" onclick="githubBuild()">Trigger GitHub build</button>
        <button class="ghost" onclick="renderAgentSetup()">Refresh</button>
      </div>
      <p class="muted" style="margin-top:10px">Requires the repo + PAT entered at setup (repo + actions: write/read). The server fires <code>workflow_dispatch</code>, waits for success and downloads the signed MSI into the volume automatically.</p>`;
  } else {
    body = `<p class="muted">Build the MSI yourself (Windows machine): <code>build-agent.ps1</code> then <code>build-msi.ps1</code>, or run the CI <code>agent-build</code> workflow, then upload the MSI into the server's <code>agent_artifacts</code> volume.</p>`;
  }
  return body;
}

async function githubBuild() {
  const btn = event.target;
  btn.disabled = true; btn.textContent = 'Triggering…';
  try {
    const r = await api('/api/build/status');
    const repo = r.github_repo;
    if (!repo) { alert('No GitHub repo configured. Edit settings or re-run setup.'); return; }
    // validate + trigger using the stored token (never re-entered here)
    const val = await fetch('/api/build/trigger', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ repo, token: '', branch: 'main' }) });
    if (!val.ok) { const d = await val.json(); alert(d.detail || 'Trigger failed'); return; }
    renderAgentSetup();
  } catch (e) { alert('Trigger failed: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = 'Trigger GitHub build'; }
}

start();
</script>
