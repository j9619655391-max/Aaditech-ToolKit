<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT-Toolkit Enterprise — Portal</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --good:#4ade80; --bad:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 24px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; }
  header h1 { font-size:18px; margin:0; }
  nav button { background:none; border:1px solid var(--line); color:var(--text); padding:6px 14px; border-radius:6px; cursor:pointer; }
  nav button.active { background:var(--accent); border-color:var(--accent); color:#0f172a; font-weight:600; }
  #tokwrap { margin-left:auto; display:flex; align-items:center; gap:8px; }
  #token { background:var(--bg); border:1px solid var(--line); color:var(--text); padding:6px 10px; border-radius:6px; width:200px; }
  main { padding:24px; max-width:1100px; margin:0 auto; }
  table { width:100%; border-collapse:collapse; margin-top:12px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:top; }
  th { color:var(--muted); text-transform:uppercase; font-size:11px; letter-spacing:.5px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; }
  .on { background:rgba(74,222,128,.15); color:var(--good); }
  .off { background:rgba(248,113,113,.15); color:var(--bad); }
  button.action { background:var(--accent); border:none; color:#0f172a; padding:4px 10px; border-radius:6px; cursor:pointer; font-weight:600; }
  pre { background:#0b1120; padding:12px; border-radius:8px; overflow:auto; max-height:320px; font-size:12px; }
  .muted { color:var(--muted); font-size:12px; }
  textarea { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:8px; font-family:monospace; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>🛠 IT-Toolkit Enterprise</h1>
  <nav>
    <button data-view="agents" class="active">Agents</button>
    <button data-view="events">Events</button>
    <button data-view="features">Features</button>
    <button data-view="help">Setup Help</button>
  </nav>
  <div id="tokwrap">
    <input id="token" type="password" placeholder="API token" />
  </div>
</header>
<main id="app"></main>
<script>
const tokenInput = document.getElementById('token');
const app = document.getElementById('app');
let view = 'agents';
const stored = localStorage.getItem('ittk_token');
if (stored) tokenInput.value = stored;
tokenInput.addEventListener('change', () => localStorage.setItem('ittk_token', tokenInput.value.trim()));

document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  view = b.dataset.view;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  render();
}));

async function api(path, opts = {}) {
  const headers = { 'Authorization': 'Bearer ' + tokenInput.value.trim(), 'Content-Type': 'application/json' };
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401) { app.innerHTML = '<p class="muted">Enter the API token (top-right) — from your server .env.</p>'; return null; }
  if (!res.ok) { app.innerHTML = `<p class="muted">Error ${res.status}</p>`; return null; }
  return res.json();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
}

async function render() {
  if (view === 'agents') return renderAgents();
  if (view === 'events') return renderEvents();
  if (view === 'features') return renderFeatures();
  renderHelp();
}

async function renderAgents() {
  const data = await api('/api/agents');
  if (!data) return;
  const rows = data.map(a => `
    <tr>
      <td>${esc(a.hostname)}</td>
      <td>${esc(a.os)}</td>
      <td>${esc(a.ip)}</td>
      <td>v${esc(a.agent_version)}</td>
      <td>${esc(new Date(a.last_seen).toLocaleString())}</td>
    </tr>`).join('');
  app.innerHTML = `
    <div class="card"><h3>Registered Agents (${data.length})</h3>
      <table><thead><tr><th>Hostname</th><th>OS</th><th>IP</th><th>Agent</th><th>Last seen</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="muted">No agents yet — install the MSI on a client.</td></tr>'}</tbody></table>
    </div>`;
}

async function renderEvents() {
  const data = await api('/api/events?limit=200');
  if (!data) return;
  const rows = data.map(e => `
    <tr>
      <td>${esc(e.hostname)}</td>
      <td>${esc(e.kind)}</td>
      <td>${e.sanitized ? '<span class="badge on">sanitized</span>' : '<span class="badge off">raw</span>'}</td>
      <td>${esc(new Date(e.captured_at).toLocaleString())}</td>
      <td><button class="action" onclick="toggleJson(${e.id})">view</button></td>
    </tr>
    <tr id="json-${e.id}" style="display:none"><td colspan="5"><pre>${esc(JSON.stringify(e.payload, null, 2))}</pre></td></tr>
  `).join('');
  app.innerHTML = `
    <div class="card"><h3>Latest Events</h3>
      <table><thead><tr><th>Agent</th><th>Kind</th><th>PII</th><th>Captured</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="muted">No events received yet.</td></tr>'}</tbody></table>
    </div>`;
}

function toggleJson(id) {
  const row = document.getElementById('json-' + id);
  row.style.display = row.style.display === 'none' ? '' : 'none';
}

async function renderFeatures() {
  const data = await api('/api/features');
  if (!data) return;
  const rows = data.map(f => `
    <div class="card">
      <h3>${esc(f.label)} <span class="badge ${f.enabled ? 'on' : 'off'}">${f.enabled ? 'enabled' : 'disabled'}</span></h3>
      <p class="muted">${esc(f.description)}<br>Script: <code>${esc(f.script)}</code></p>
      <button class="action" onclick="toggleFeature('${esc(f.name)}', ${!f.enabled})">${f.enabled ? 'Disable' : 'Enable'}</button>
      <button class="action" onclick="editFeature('${esc(f.name)}')">Edit config</button>
      <div id="cfg-${esc(f.name)}" style="display:none;margin-top:10px">
        <textarea id="cfgval-${esc(f.name)}" rows="4">${esc(JSON.stringify(f.config || {}, null, 2))}</textarea><br>
        <button class="action" onclick="saveConfig('${esc(f.name)}')">Save</button>
      </div>
    </div>`).join('');
  app.innerHTML = `<h3>Feature Controls</h3><p class="muted">Enable/disable or tweak each toolkit feature. Agents pick these up on their next cycle.</p>${rows}`;
}

async function toggleFeature(name, enabled) {
  const r = await api('/api/features/' + name, { method: 'PUT', body: JSON.stringify({ enabled }) });
  if (r) render();
}

function editFeature(name) {
  const el = document.getElementById('cfg-' + name);
  el.style.display = el.style.display === 'none' ? '' : 'none';
}

async function saveConfig(name) {
  let cfg = {};
  try { cfg = JSON.parse(document.getElementById('cfgval-' + name).value); } catch { alert('Invalid JSON'); return; }
  const r = await api('/api/features/' + name, { method: 'PUT', body: JSON.stringify({ config: cfg }) });
  if (r) render();
}

function renderHelp() {
  app.innerHTML = `
    <div class="card"><h3>Deployment / Quick start</h3>
      <ol>
        <li><b>Server:</b> <code>cd Enterprise/deploy && ./deploy.sh</code> — detects IP, creates secrets, starts Docker.</li>
        <li><b>Agent build:</b> on Windows (or CI): <code>.\Enterprise\agent\build\build-agent.ps1</code> → <code>IT-Toolkit-Agent.exe</code> + <code>IT-Toolkit-Agent.msi</code> with the server IP baked in.</li>
        <li><b>Client install:</b> push the MSI via Intune / GPO / SCCM — <code>msiexec /i IT-Toolkit-Agent.msi /qn</code>.</li>
        <li><b>Verify:</b> this page shows Agents + Events after the first heartbeat.</li>
      </ol>
      <p class="muted">API token lives in <code>Enterprise/.env</code> (<code>API_TOKEN</code>).</p>
    </div>`;
}

render();
</script>
</body>
</html>
