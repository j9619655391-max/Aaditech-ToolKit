<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT-Toolkit Enterprise</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --good:#4ade80; --bad:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 24px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; }
  header h1 { font-size:17px; margin:0; }
  header .sub { color:var(--muted); font-size:12px; margin-left:4px; }
  nav button { background:none; border:1px solid var(--line); color:var(--text); padding:6px 14px; border-radius:6px; cursor:pointer; }
  nav button.active { background:var(--accent); border-color:var(--accent); color:#0f172a; font-weight:600; }
  #authwrap { margin-left:auto; display:flex; align-items:center; gap:10px; }
  main { padding:24px; max-width:1100px; margin:0 auto; }
  table { width:100%; border-collapse:collapse; margin-top:12px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:top; }
  th { color:var(--muted); text-transform:uppercase; font-size:11px; letter-spacing:.5px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; }
  .on { background:rgba(74,222,128,.15); color:var(--good); }
  .off { background:rgba(248,113,113,.15); color:var(--bad); }
  button.action { background:var(--accent); border:none; color:#0f172a; padding:5px 12px; border-radius:6px; cursor:pointer; font-weight:600; }
  button.ghost { background:none; border:1px solid var(--line); color:var(--text); padding:5px 12px; border-radius:6px; cursor:pointer; }
  pre { background:#0b1120; padding:12px; border-radius:8px; overflow:auto; max-height:320px; font-size:12px; }
  .muted { color:var(--muted); font-size:12px; }
  input, textarea, select { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:8px; font-size:13px; }
  textarea { font-family:monospace; font-size:12px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  .center { max-width:420px; margin:8vh auto 0; }
  .center h2 { margin:0 0 4px; }
  .row { display:flex; gap:10px; align-items:center; }
  .error { color:var(--bad); font-size:13px; margin-top:10px; }
  .code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; background:#0b1120; padding:10px; border-radius:8px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
<header id="header" style="display:none">
  <h1><span id="company"></span> <span class="sub" id="subtitle">IT-Toolkit Enterprise</span></h1>
  <nav>
    <button data-view="agents" class="active">Agents</button>
    <button data-view="fleet">Fleet</button>
    <button data-view="events">Events</button>
    <button data-view="commands">Commands</button>
    <button data-view="alerts">Alerts <span id="alertBadge" style="display:none;background:var(--bad);color:#0f172a;border-radius:999px;padding:0 6px;font-size:11px;margin-left:4px"></span></button>
    <button data-view="reports">Reports</button>
    <button data-view="features">Features</button>
    <button data-view="users">Users</button>
    <button data-view="agent">Agent Setup</button>
  </nav>
  <div id="authwrap">
    <span class="muted" id="who"></span>
    <button class="ghost" onclick="logout()">Log out</button>
  </div>
</header>
<main id="app"></main>

<script>
const app = document.getElementById('app');
let view = 'agents';

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401) { startAuthFlow(); return null; }
  if (!res.ok) { app.innerHTML = `<p class="muted">Error ${res.status}: ${esc((await res.json()).detail ?? '')}</p>`; return null; }
  return res.json();
}

function applyBranding(b) {
  if (b && b.color) document.documentElement.style.setProperty('--accent', b.color);
  const c = document.getElementById('company');
  c.textContent = b && b.logo_text ? b.logo_text : (b && b.company) || 'IT-Toolkit';
  document.title = (b && b.logo_text) ? b.logo_text + ' — IT-Toolkit' : 'IT-Toolkit Enterprise';
}

// ---------------------------------------------------------------- flow

async function start() {
  const status = await fetch('/api/setup/status').then(r => r.json()).catch(() => ({ setup_complete: false }));
  window.__defaultBuildMode = status.default_build_mode || 'manual';
  if (!status.setup_complete) return renderSetup();
  let boot;
  try {
    const res = await fetch('/api/bootstrap');
    if (!res.ok) throw new Error(res.status);
    boot = await res.json();
  } catch { return renderLogin(); }
  window.boot = boot;
  window.user = boot.user;
  applyBranding(boot);
  document.getElementById('header').style.display = 'flex';
  document.getElementById('who').textContent = (boot.user ? boot.user.username + ' · ' + boot.user.role : '');
  setupNav();
  refreshAlertBadge();
  setInterval(refreshAlertBadge, 30000);
  render();
}

async function refreshAlertBadge() {
  try {
    const r = await fetch('/api/alerts/open');
    if (!r.ok) return;
    const d = await r.json();
    const badge = document.getElementById('alertBadge');
    if (d.open > 0) { badge.textContent = d.open; badge.style.display = 'inline'; }
    else badge.style.display = 'none';
  } catch {}
}

function setupNav() {
  const isAdmin = window.user && window.user.role === 'admin';
  const canAgentSetup = window.user && (window.user.role === 'admin' || window.user.role === 'operation');
  document.querySelectorAll('nav button').forEach(b => {
    if (b.dataset.view === 'users') b.style.display = isAdmin ? '' : 'none';
    if (b.dataset.view === 'agent') b.style.display = canAgentSetup ? '' : 'none';
  });
}

// ---------------------------------------------------------------- setup wizard

function renderSetup() {
  const host = window.location.hostname || 'localhost';
  app.innerHTML = `
    <div class="center card">
      <h2>IT-Toolkit Enterprise setup</h2>
      <p class="muted">First-time configuration — done once on the server. Certs and secrets are generated here and kept on this machine.</p>
      <label>Company name</label><input id="company_name" placeholder="Acme Inc." />
      <label>Server address (used for agent connections)</label><input id="server_host" value="${esc(host)}" />
      <div class="row">
        <div style="flex:1"><label>Admin username</label><input id="admin_username" value="admin" /></div>
        <div style="flex:1"><label>Brand color</label><input id="branding_color" type="color" value="#38bdf8" style="padding:2px;height:38px" /></div>
      </div>
      <label>Admin password (min 8 chars)</label><input id="admin_password" type="password" />
      <label>Repeat password</label><input id="admin_password2" type="password" />

      <div style="margin-top:22px;border-top:1px solid var(--line);padding-top:8px">
        <label style="font-size:14px;color:var(--text);font-weight:600">Alert email (SMTP) — optional</label>
        <p class="muted">Send alert notifications by email. Pick your hosting provider or use custom settings.</p>
        <label>Email provider</label>
        <select id="smtp_provider" onchange="smtpProviderChange()">
          <option value="none">Don't send email alerts</option>
          <option value="hostinger">Hostinger</option>
          <option value="office365">Office 365</option>
          <option value="gmail">Gmail</option>
          <option value="hotmail">Hotmail / Outlook</option>
          <option value="custom">Custom SMTP</option>
        </select>
        <div id="smtp_fields" style="display:none">
          <label>Email address</label><input id="smtp_email" value="it-tool@aaditechs.in" />
          <label>Email password (or app password)</label><input id="smtp_password" type="password" />
          <label>Alert recipient (defaults to the email above)</label><input id="smtp_recipient" value="it-tool@aaditechs.in" />
          <div id="smtp_custom" style="display:none">
            <div class="row">
              <div style="flex:2"><label>SMTP host</label><input id="smtp_host" placeholder="smtp.example.com" /></div>
              <div style="flex:1"><label>Port</label><input id="smtp_port" value="587" /></div>
            </div>
            <label>Encryption</label>
            <select id="smtp_encryption">
              <option value="starttls">STARTTLS</option>
              <option value="ssl">SSL/TLS</option>
              <option value="none">None</option>
            </select>
          </div>
        </div>
      </div>

      <div style="margin-top:22px;border-top:1px solid var(--line);padding-top:8px">
        <label style="font-size:14px;color:var(--text);font-weight:600">Agent MSI build</label>
        <p class="muted">How the Windows agent installer gets built. Windows Server builds locally (fully automatic). A Linux server can trigger this repo's GitHub Actions and pull the signed MSI back automatically.</p>
        <select id="build_mode" onchange="buildModeChange()">
          <option value="local_windows">Windows Server — build locally here (automatic)</option>
          <option value="github">GitHub Actions — remote build (Linux server)</option>
          <option value="manual">Manual — I'll build/upload the MSI myself</option>
        </select>
        <div id="github_fields" style="display:none">
          <label>GitHub repo (owner/repo)</label><input id="github_repo" placeholder="j9619655391-max/Aaditech-ToolKit" />
          <label>Personal access token (PAT — needs actions:write + actions:read)</label><input id="github_token" type="password" placeholder="ghp_..." />
          <p class="muted">After setup, the Agent Setup page can trigger the build and download the MSI. Create a PAT at github.com → Settings → Developer settings → Personal access tokens → fine-grained (repo + actions) with Actions: Read/Write.</p>
        </div>
      </div>

      <div class="error" id="setup_err"></div>
      <div style="margin-top:18px"><button class="action" style="width:100%" onclick="doSetup()">Finish setup</button></div>
    </div>`;
  const sel = document.getElementById('build_mode');
  if (sel) {
    if (window.__defaultBuildMode && sel.querySelector(`option[value="${esc(window.__defaultBuildMode)}"]`)) {
      sel.value = window.__defaultBuildMode;
    }
    buildModeChange();
  }
}

function smtpProviderChange() {
  const p = document.getElementById('smtp_provider').value;
  const custom = p === 'custom';
  document.getElementById('smtp_fields').style.display = p === 'none' ? 'none' : 'block';
  document.getElementById('smtp_custom').style.display = custom ? 'block' : 'none';
}

function buildModeChange() {
  const m = document.getElementById('build_mode').value;
  document.getElementById('github_fields').style.display = m === 'github' ? 'block' : 'none';
}

async function doSetup() {
  const err = document.getElementById('setup_err');
  const p1 = document.getElementById('admin_password').value;
  const p2 = document.getElementById('admin_password2').value;
  if (p1.length < 8) { err.textContent = 'Password must be at least 8 characters.'; return; }
  if (p1 !== p2) { err.textContent = 'Passwords do not match.'; return; }
  const provider = document.getElementById('smtp_provider').value;
  const smtp = { provider };
  if (provider !== 'none') {
    smtp.email = document.getElementById('smtp_email').value.trim();
    smtp.password = document.getElementById('smtp_password').value;
    smtp.recipient = document.getElementById('smtp_recipient').value.trim();
    if (provider === 'custom') {
      smtp.host = document.getElementById('smtp_host').value.trim();
      smtp.port = parseInt(document.getElementById('smtp_port').value, 10) || null;
      smtp.encryption = document.getElementById('smtp_encryption').value;
    }
  }
  const body = {
    company_name: document.getElementById('company_name').value.trim(),
    server_host: document.getElementById('server_host').value.trim(),
    admin_username: document.getElementById('admin_username').value.trim(),
    admin_password: p1,
    branding: { color: document.getElementById('branding_color').value, logo_text: document.getElementById('company_name').value.trim() },
    smtp,
    build_mode: document.getElementById('build_mode').value,
    github_repo: document.getElementById('github_repo').value.trim(),
    github_token: document.getElementById('github_token').value.trim(),
  };
  const res = await fetch('/api/setup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) { err.textContent = (await res.json()).detail || 'Setup failed'; return; }
  const data = await res.json();
  if (data.session_secret) return renderSecretBackup(data.session_secret);
  start();
}

function renderSecretBackup(secret) {
  const blob = new Blob([secret + '\n'], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  app.innerHTML = `
    <div class="center card">
      <h2>Setup complete — save your encryption key</h2>
      <p class="muted">This key encrypts stored secrets (SMTP password, GitHub token) and signs login sessions.
      It is shown <b>only once</b>. Download it now — you'll need it to restore this server from a backup.
      Treat it like a password: anyone with it can decrypt your stored secrets.</p>
      <div style="margin:14px 0;padding:10px;background:#0b0f14;border:1px solid #2a3b4d;border-radius:8px;font-family:monospace;word-break:break-all;font-size:13px">${esc(secret)}</div>
      <div class="row" style="align-items:flex-end;gap:10px">
        <a class="action" style="flex:1;text-align:center" href="${url}" download="itk-session-secret.txt">Download key file</a>
        <button class="action" style="flex:1" onclick="copySecret('${esc(secret)}', this)">Copy</button>
      </div>
      <div style="margin-top:18px"><button class="action" style="width:100%" onclick="start()">Continue to dashboard</button></div>
    </div>`;
}

function copySecret(secret, btn) {
  navigator.clipboard.writeText(secret).then(() => { btn.textContent = 'Copied'; }).catch(() => {});
}

// ---------------------------------------------------------------- login

function renderLogin() {
  app.innerHTML = `
    <div class="center card">
      <h2>Sign in</h2>
      <p class="muted">Use your IT-Toolkit account.</p>
      <label>Username</label><input id="login_user" />
      <label>Password</label><input id="login_pass" type="password" />
      <div class="error" id="login_err"></div>
      <div style="margin-top:18px"><button class="action" style="width:100%" onclick="doLogin()">Sign in</button></div>
    </div>`;
}

async function doLogin() {
  const err = document.getElementById('login_err');
  const res = await fetch('/api/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: document.getElementById('login_user').value.trim(), password: document.getElementById('login_pass').value }),
  });
  if (!res.ok) { err.textContent = 'Invalid username or password.'; return; }
  start();
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  startAuthFlow();
}

function startAuthFlow() {
  document.getElementById('header').style.display = 'none';
  start();
}

// ---------------------------------------------------------------- nav

document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  view = b.dataset.view;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  render();
}));

async function render() {
  if (view === 'agents') return renderAgents();
  if (view === 'fleet') return renderFleet();
  if (view === 'events') return renderEvents();
  if (view === 'commands') return renderCommands();
  if (view === 'alerts') return renderAlerts();
  if (view === 'reports') return renderReports();
  if (view === 'features') return renderFeatures();
  if (view === 'users') return renderUsers();
  renderAgentSetup();
}

// ---------------------------------------------------------------- fleet panels

function latestByHost(events) {
  const m = {};
  for (const e of events || []) {
    const t = new Date(e.captured_at).getTime();
    if (!m[e.hostname] || t > m[e.hostname].t) m[e.hostname] = { e, t };
  }
  return Object.values(m).map(x => x.e);
}

async function renderFleet() {
  const agents  = await api('/api/agents');
  if (!agents) return;
  const disks   = latestByHost(await api('/api/events?kind=diskhealth&limit=100'));
  const hw      = latestByHost(await api('/api/events?kind=hardware&limit=100'));
  const updates = latestByHost(await api('/api/events?kind=updatecompliance&limit=100'));
  const health  = latestByHost(await api('/api/events?kind=health&limit=100'));

  const isAdmin = window.user && window.user.role === 'admin';
  const now = Date.now();
  const offline = (agents || []).filter(a => now - new Date(a.last_seen).getTime() > 10 * 60 * 1000);

  const offlineBlock = `
    <div class="card"><h3>Offline agents (last seen &gt; 10 min) <span class="badge ${offline.length ? 'off' : 'on'}">${offline.length}</span></h3>
      ${offline.length
        ? `<table><thead><tr><th>Hostname</th><th>IP</th><th>Last seen</th></tr></thead><tbody>
             ${offline.map(a => `<tr><td>${esc(a.hostname)}</td><td>${esc(a.ip)}</td><td>${esc(new Date(a.last_seen).toLocaleString())}</td></tr>`).join('')}
           </tbody></table>`
        : '<p class="muted">All agents have checked in recently.</p>'}
    </div>`;

  const diskRows = disks.map(e => {
    const p = e.payload || {};
    const failing = p.predicted_failure || (p.smart_failures && p.smart_failures.length);
    return `<tr>
      <td>${esc(e.hostname)}</td>
      <td>${(p.disks || []).map(d => `${esc(d.Name)} ${d.SizeGB}GB <span class="badge ${d.HealthStatus === 'Healthy' ? 'on' : 'off'}">${esc(d.HealthStatus || '?')}</span>`).join('<br>') || '-'}</td>
      <td>${failing ? `<span class="badge off">${(p.smart_failures || []).length} SMART failure(s)</span>` : '<span class="badge on">OK</span>'}</td>
    </tr>`;
  }).join('');

  const batRows = hw.filter(e => e.payload && e.payload.battery && e.payload.battery.wear_percent != null)
    .sort((a, b) => b.payload.battery.wear_percent - a.payload.battery.wear_percent)
    .map(e => {
      const w = e.payload.battery.wear_percent;
      return `<tr><td>${esc(e.hostname)}</td><td>${esc(e.payload.model || '')}</td>
        <td><span class="badge ${w > 30 ? 'off' : 'on'}">${w}%</span></td>
        <td>${w > 30 ? 'Degraded' : 'OK'}</td></tr>`;
    }).join('');

  const updRows = updates.map(e => {
    const p = e.payload || {};
    return `<tr><td>${esc(e.hostname)}</td><td>${esc(p.last_install_date || 'unknown')}</td><td>${esc(p.last_session_result ?? '')}</td></tr>`;
  }).join('');

  const healthRows = health.map(e => {
    const p = e.payload || {};
    const pend = p.reboot_pending ? '<span class="badge off">reboot pending</span>' : '<span class="badge on">ok</span>';
    return `<tr><td>${esc(e.hostname)}</td><td>${esc(p.uptime_hours)}h</td><td>${esc(p.cpu_percent ?? '?')}%</td><td>${esc(p.memory_percent ?? '?')}%</td><td>${pend}</td></tr>`;
  }).join('');

  let licenseBlock = '';
  if (isAdmin) {
    const lic = latestByHost(await api('/api/events?kind=licenses&limit=100'));
    licenseBlock = `<div class="card"><h3>License info (admin only)</h3>
      <table><thead><tr><th>Hostname</th><th>Windows key (last 5)</th><th>Office keys (last 5)</th></tr></thead>
      <tbody>${lic.map(e => {
        const p = e.payload || {};
        return `<tr><td>${esc(e.hostname)}</td><td>${esc(p.windows_key_last5 || '-')}</td><td>${(p.office_keys_last5 || []).map(esc).join(', ') || '-'}</td></tr>`;
      }).join('') || '<tr><td colspan="3" class="muted">No license reports yet (feature is off by default).</td></tr>'}</tbody></table>
    </div>`;
  }

  app.innerHTML = offlineBlock + `
    <div class="card"><h3>Disk health (SMART)</h3>
      <table><thead><tr><th>Hostname</th><th>Disks</th><th>SMART</th></tr></thead>
      <tbody>${diskRows || '<tr><td colspan="3" class="muted">No disk health reports yet.</td></tr>'}</tbody></table>
    </div>
    <div class="card"><h3>Battery wear</h3>
      <table><thead><tr><th>Hostname</th><th>Model</th><th>Wear</th><th>Status</th></tr></thead>
      <tbody>${batRows || '<tr><td colspan="4" class="muted">No battery reports yet (desktop machines have none).</td></tr>'}</tbody></table>
    </div>
    <div class="card"><h3>Update compliance</h3>
      <table><thead><tr><th>Hostname</th><th>Last install</th><th>Last session result</th></tr></thead>
      <tbody>${updRows || '<tr><td colspan="3" class="muted">No update reports yet.</td></tr>'}</tbody></table>
    </div>
    <div class="card"><h3>System health</h3>
      <table><thead><tr><th>Hostname</th><th>Uptime</th><th>CPU</th><th>RAM</th><th>Reboot</th></tr></thead>
      <tbody>${healthRows || '<tr><td colspan="5" class="muted">No health reports yet.</td></tr>'}</tbody></table>
    </div>` + licenseBlock;
}

async function renderAgents() {
  const data = await api('/api/agents');
  if (!data) return;
  const rows = data.map(a => `
    <tr>
      <td>${esc(a.hostname)}</td>
      <td>${esc(a.os)}</td>
      <td>${esc(a.ip)}</td>
      <td>v${esc(a.agent_version)}</td>
      <td>${esc(new Date(a.last_seen).toLocaleString())}</td>
    </tr>`).join('');
  app.innerHTML = `
    <div class="card"><h3>Registered Agents (${data.length})</h3>
      <table><thead><tr><th>Hostname</th><th>OS</th><th>IP</th><th>Agent</th><th>Last seen</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="muted">No agents yet — see the Agent Setup tab.</td></tr>'}</tbody></table>
    </div>`;
}

async function renderEvents() {
  const data = await api('/api/events?limit=200');
  if (!data) return;
  const rows = data.map(e => `
    <tr>
      <td>${esc(e.hostname)}</td>
      <td>${esc(e.kind)}</td>
      <td>${e.sanitized ? '<span class="badge on">sanitized</span>' : '<span class="badge off">raw</span>'}</td>
      <td>${esc(new Date(e.captured_at).toLocaleString())}</td>
      <td><button class="action" onclick="toggleJson(${e.id})">view</button></td>
    </tr>
    <tr id="json-${e.id}" style="display:none"><td colspan="5"><pre>${esc(JSON.stringify(e.payload, null, 2))}</pre></td></tr>
  `).join('');
  app.innerHTML = `
    <div class="card"><h3>Latest Events</h3>
      <table><thead><tr><th>Agent</th><th>Kind</th><th>PII</th><th>Captured</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="muted">No events received yet.</td></tr>'}</tbody></table>
    </div>`;
}

function toggleJson(id) {
  const row = document.getElementById('json-' + id);
  row.style.display = row.style.display === 'none' ? '' : 'none';
}

// ---------------------------------------------------------------- commands (P5)

function cmdKind() {
  const k = document.getElementById('cmd_kind').value;
  const f = document.getElementById('cmd_fields');
  if (k === 'reboot') {
    f.innerHTML = '<label>Delay (seconds)</label><input id="cmd_delay" type="number" value="0" min="0" />';
  } else if (k === 'wake') {
    f.innerHTML = '<label>MAC</label><input id="cmd_mac" placeholder="AA:BB:CC:DD:EE:FF" /><label>IP (optional)</label><input id="cmd_ip" placeholder="255.255.255.255" />';
  } else {
    f.innerHTML = '<label>Script (path relative to install root)</label><input id="cmd_script" placeholder="Scripts/QuickCheck.ps1" />';
  }
}

async function issueCmd() {
  const err = document.getElementById('cmd_err');
  const k = document.getElementById('cmd_kind').value;
  const payload = {};
  if (k === 'reboot') payload.delay_seconds = parseInt(document.getElementById('cmd_delay').value || '0', 10);
  else if (k === 'wake') {
    payload.mac = document.getElementById('cmd_mac').value.trim();
    payload.ip = document.getElementById('cmd_ip').value.trim();
  } else {
    payload.script = document.getElementById('cmd_script').value.trim();
  }
  const body = {
    agent_id: parseInt(document.getElementById('cmd_agent').value, 10),
    kind: k,
    payload,
  };
  const res = await api('/api/commands', { method: 'POST', body: JSON.stringify(body) });
  if (res) renderCommands();
}

function toggleCmd(id) {
  const row = document.getElementById('cmd-' + id);
  row.style.display = row.style.display === 'none' ? '' : 'none';
}

async function renderCommands() {
  const [agents, cmds] = await Promise.all([api('/api/agents'), api('/api/commands')]);
  if (!cmds) return;
  const canIssue = window.user && (window.user.role === 'admin' || window.user.role === 'operation');
  const rows = cmds.map(c => `
    <tr>
      <td>${esc(c.hostname)}</td>
      <td>${esc(c.kind)}</td>
      <td><span class="badge ${c.status === 'completed' ? 'on' : c.status === 'failed' ? 'off' : ''}">${esc(c.status)}</span></td>
      <td>${esc(new Date(c.created_at).toLocaleString())}</td>
      <td><button class="action" onclick="toggleCmd(${c.id})">view</button></td>
    </tr>
    <tr id="cmd-${c.id}" style="display:none"><td colspan="5">
      <pre>payload: ${esc(JSON.stringify(c.payload, null, 2))}
${c.result ? 'result: ' + esc(JSON.stringify(c.result, null, 2)) : ''}</pre>
    </td></tr>`).join('');

  const form = canIssue ? `
    <div class="card"><h3>Issue command</h3>
      <div class="row" style="align-items:flex-end;flex-wrap:wrap">
        <div style="flex:2;min-width:180px"><label>Agent</label>
          <select id="cmd_agent">${(agents || []).map(a => `<option value="${a.id}">${esc(a.hostname)}</option>`).join('') || '<option>—</option>'}</select></div>
        <div style="flex:1;min-width:140px"><label>Kind</label>
          <select id="cmd_kind" onchange="cmdKind()"><option value="reboot">reboot</option><option value="wake">wake</option><option value="run-script">run-script</option></select></div>
        <div style="flex:2;min-width:180px" id="cmd_fields"></div>
        <div style="min-width:80px"><button class="action" onclick="issueCmd()">Send</button></div>
      </div>
      <div class="error" id="cmd_err"></div>
    </div>` : '<p class="muted">Your role is read-only for commands.</p>';

  app.innerHTML = form + `
    <div class="card"><h3>Command history</h3>
      <table><thead><tr><th>Agent</th><th>Kind</th><th>Status</th><th>Issued</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="muted">No commands issued yet.</td></tr>'}</tbody></table>
    </div>`;
  cmdKind();
}

// ---------------------------------------------------------------- alerts (P6)

let alertFilter = 'open';

async function ackAlert(id) {
  const r = await api('/api/alerts/' + id + '/ack', { method: 'POST' });
  if (r) { renderAlerts(); refreshAlertBadge(); }
}

async function resolveAlert(id) {
  const r = await api('/api/alerts/' + id + '/resolve', { method: 'POST' });
  if (r) { renderAlerts(); refreshAlertBadge(); }
}

async function toggleRule(name, enabled) {
  const r = await api('/api/alert-rules/' + name, { method: 'PUT', body: JSON.stringify({ enabled }) });
  if (r) renderAlerts();
}

async function saveRule(name) {
  const sev = document.getElementById('rule-sev-' + name).value;
  const condEl = document.getElementById('rule-cond-' + name);
  let cond = {};
  try { cond = JSON.parse(condEl.value); } catch { alert('Invalid condition JSON'); return; }
  const r = await api('/api/alert-rules/' + name, { method: 'PUT', body: JSON.stringify({ severity: sev, condition: cond }) });
  if (r) renderAlerts();
}

async function renderAlerts() {
  const [alerts, rules] = await Promise.all([
    api('/api/alerts?status=' + (alertFilter === 'all' ? '' : alertFilter) + '&limit=200'),
    api('/api/alert-rules'),
  ]);
  if (!alerts) return;
  const canAct = window.user && (window.user.role === 'admin' || window.user.role === 'operation');
  const isAdmin = window.user && window.user.role === 'admin';
  const severityBadge = s => `<span class="badge ${s === 'critical' ? 'off' : s === 'warning' ? '' : 'on'}">${esc(s)}</span>`;

  const rows = alerts.map(al => `
    <tr>
      <td>${esc(al.hostname || '—')}</td>
      <td>${esc(al.rule || '')}</td>
      <td>${severityBadge(al.severity)}</td>
      <td>${esc(al.message)}</td>
      <td><span class="badge ${al.status === 'open' ? 'off' : al.status === 'acknowledged' ? '' : 'on'}">${esc(al.status)}</span></td>
      <td>${esc(new Date(al.created_at).toLocaleString())}</td>
      <td>${canAct && al.status !== 'resolved'
        ? (al.status === 'open'
            ? `<button class="action" onclick="ackAlert(${al.id})">Ack</button> `
            : '')
          + `<button class="ghost" onclick="resolveAlert(${al.id})">Resolve</button>`
        : ''}</td>
    </tr>`).join('');

  const filterBtns = ['open', 'acknowledged', 'resolved', 'all'].map(s =>
    `<button class="ghost ${alertFilter === s ? 'active' : ''}" style="${alertFilter === s ? 'background:var(--accent);border-color:var(--accent);color:#0f172a' : ''}" onclick="setAlertFilter('${s}')">${s}</button>`).join(' ');

  const emailBlock = isAdmin ? `
    <div class="card"><h3>Email notifications (admin)</h3>
      <p class="muted">SMTP is configured during first-time setup (or via SMTP_* env vars). Send a test to verify delivery.</p>
      <button class="action" onclick="testAlertEmail()">Send test email</button>
      <span id="email_test_result" class="muted"></span>
    </div>` : '';

  const rulesBlock = isAdmin ? `
    <div class="card"><h3>Alert rules (admin)</h3>
      <table><thead><tr><th>Rule</th><th>Severity</th><th>Condition</th><th>Enabled</th><th></th></tr></thead>
      <tbody>${(rules || []).map(r => `
        <tr>
          <td>${esc(r.name)}<br><span class="muted">${esc(r.description || '')}</span></td>
          <td><select id="rule-sev-${esc(r.name)}"><option ${r.severity === 'info' ? 'selected' : ''}>info</option><option ${r.severity === 'warning' ? 'selected' : ''}>warning</option><option ${r.severity === 'critical' ? 'selected' : ''}>critical</option></select></td>
          <td><textarea id="rule-cond-${esc(r.name)}" rows="3" style="width:100%;font-size:11px">${esc(JSON.stringify(r.condition, null, 2))}</textarea></td>
          <td><button class="action" onclick="toggleRule('${esc(r.name)}', ${!r.enabled})">${r.enabled ? 'enabled' : 'disabled'}</button></td>
          <td><button class="ghost" onclick="saveRule('${esc(r.name)}')">Save</button></td>
        </tr>`).join('')}</tbody></table>
    </div>` : '';

  app.innerHTML = `
    <div class="card"><h3>Alerts</h3>
      <div style="margin-bottom:8px">${filterBtns}</div>
      <table><thead><tr><th>Agent</th><th>Rule</th><th>Severity</th><th>Message</th><th>Status</th><th>Created</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="7" class="muted">No alerts match this filter.</td></tr>'}</tbody></table>
    </div>` + emailBlock + rulesBlock;
}

async function testAlertEmail() {
  const out = document.getElementById('email_test_result');
  out.textContent = 'Sending…';
  try {
    const r = await fetch('/api/alerts/test-email', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
    const j = await r.json().catch(() => ({}));
    out.textContent = r.ok ? `Sent to ${j.to || ''}` : (j.detail || 'Failed');
  } catch { out.textContent = 'Failed'; }
}

function setAlertFilter(s) { alertFilter = s; renderAlerts(); }

// ---------------------------------------------------------------- reports (P6)

async function renderReports() {
  const agents = await api('/api/agents');
  if (!agents) return;
  app.innerHTML = `
    <div class="card"><h3>Fleet report</h3>
      <p class="muted">One row per agent with the latest hardware/health/update snapshot. Download as CSV.</p>
      <a href="/api/report/fleet" class="action" style="text-decoration:none;display:inline-block">Export fleet CSV</a>
    </div>
    <div class="card"><h3>Agent report</h3>
      <p class="muted">All collected events for a single agent.</p>
      <div class="row" style="align-items:flex-end;flex-wrap:wrap">
        <div style="flex:2;min-width:200px"><label>Agent</label>
          <select id="rep_agent">${(agents || []).map(a => `<option value="${a.id}">${esc(a.hostname)}</option>`).join('') || '<option>—</option>'}</select></div>
        <div style="min-width:80px"><a id="rep_json" href="#" class="action" style="text-decoration:none;display:inline-block;margin-right:8px">JSON</a><a id="rep_csv" href="#" class="ghost" style="text-decoration:none;display:inline-block">CSV</a></div>
      </div>
    </div>`;
  const sel = document.getElementById('rep_agent');
  const link = () => {
    const id = sel.value;
    document.getElementById('rep_json').href = '/api/report/agent/' + id + '?format=json';
    document.getElementById('rep_csv').href = '/api/report/agent/' + id + '?format=csv';
  };
  sel.addEventListener('change', link);
  link();
}

async function renderFeatures() {
  const data = await api('/api/features');
  if (!data) return;
  const canConfig = window.user && window.user.role !== 'monitoring';
  const controls = f => canConfig
    ? `<button class="action" onclick="toggleFeature('${esc(f.name)}', ${!f.enabled})">${f.enabled ? 'Disable' : 'Enable'}</button>
       <button class="action" onclick="editFeature('${esc(f.name)}')">Edit config</button>
       <div id="cfg-${esc(f.name)}" style="display:none;margin-top:10px">
         <textarea id="cfgval-${esc(f.name)}" rows="4">${esc(JSON.stringify(f.config || {}, null, 2))}</textarea><br>
         <button class="action" onclick="saveConfig('${esc(f.name)}')">Save</button>
       </div>`
    : '<span class="muted">Read-only for your role</span>';
  const rows = data.map(f => `
    <div class="card">
      <h3>${esc(f.label)} <span class="badge ${f.enabled ? 'on' : 'off'}">${f.enabled ? 'enabled' : 'disabled'}</span></h3>
      <p class="muted">${esc(f.description)}<br>Script: <code>${esc(f.script)}</code></p>
      ${controls(f)}
    </div>`).join('');
  app.innerHTML = `<h3>Feature Controls</h3><p class="muted">Enable/disable or tweak each toolkit feature. Agents pick these up on their next cycle.</p>${rows}`;
}

async function toggleFeature(name, enabled) {
  const r = await api('/api/features/' + name, { method: 'PUT', body: JSON.stringify({ enabled }) });
  if (r) render();
}

function editFeature(name) {
  const el = document.getElementById('cfg-' + name);
  el.style.display = el.style.display === 'none' ? '' : 'none';
}

async function saveConfig(name) {
  let cfg = {};
  try { cfg = JSON.parse(document.getElementById('cfgval-' + name).value); } catch { alert('Invalid JSON'); return; }
  const r = await api('/api/features/' + name, { method: 'PUT', body: JSON.stringify({ config: cfg }) });
  if (r) render();
}

// ---------------------------------------------------------------- users (admin)

async function renderUsers() {
  const data = await api('/api/users');
  if (!data) return;
  const rows = data.map(u => `
    <tr>
      <td>${esc(u.username)}</td>
      <td><span class="badge ${u.active ? 'on' : 'off'}">${esc(u.role)}</span></td>
      <td>${u.active ? '<span class="badge on">active</span>' : '<span class="badge off">disabled</span>'}</td>
      <td>${esc(new Date(u.created_at).toLocaleString())}</td>
      <td>
        <button class="action" onclick="promptReset('${u.id}', '${esc(u.username)}')">Reset password</button>
        ${u.username === window.user.username
          ? '<span class="muted">(you)</span>'
          : `<button class="ghost" onclick="toggleActive('${u.id}', ${!u.active})">${u.active ? 'Disable' : 'Enable'}</button>`}
        <select onchange="changeRole('${u.id}', this.value)">
          <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>admin</option>
          <option value="operation" ${u.role === 'operation' ? 'selected' : ''}>operation</option>
          <option value="monitoring" ${u.role === 'monitoring' ? 'selected' : ''}>monitoring</option>
        </select>
      </td>
    </tr>`).join('');
  app.innerHTML = `
    <div class="card"><h3>Team users</h3>
      <table><thead><tr><th>Username</th><th>Role</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="muted">No users yet.</td></tr>'}</tbody></table>
    </div>
    <div class="card"><h3>Add user</h3>
      <div class="row" style="align-items:flex-end">
        <div style="flex:2"><label>Username</label><input id="nu_user" /></div>
        <div style="flex:2"><label>Password (min 8)</label><input id="nu_pass" type="password" /></div>
        <div style="flex:1"><label>Role</label>
          <select id="nu_role"><option>monitoring</option><option>operation</option><option>admin</option></select>
        </div>
        <div><button class="action" onclick="addUser()">Create</button></div>
      </div>
      <div class="error" id="users_err"></div>
    </div>`;
}

async function addUser() {
  const err = document.getElementById('users_err');
  const body = {
    username: document.getElementById('nu_user').value.trim(),
    password: document.getElementById('nu_pass').value,
    role: document.getElementById('nu_role').value,
  };
  if (body.username.length < 3) { err.textContent = 'Username must be at least 3 characters.'; return; }
  if (body.password.length < 8) { err.textContent = 'Password must be at least 8 characters.'; return; }
  const r = await api('/api/users', { method: 'POST', body: JSON.stringify(body) });
  if (r) renderUsers();
}

async function promptReset(id, username) {
  const pw = prompt('New password for ' + username + ' (min 8 chars):');
  if (!pw) return;
  if (pw.length < 8) { alert('Password too short'); return; }
  const r = await api('/api/users/' + id, { method: 'PUT', body: JSON.stringify({ password: pw }) });
  if (r) alert('Password updated for ' + username);
}

async function toggleActive(id, active) {
  const r = await api('/api/users/' + id, { method: 'PUT', body: JSON.stringify({ active }) });
  if (r) renderUsers();
}

async function changeRole(id, role) {
  const r = await api('/api/users/' + id, { method: 'PUT', body: JSON.stringify({ role }) });
  if (r) renderUsers();
}

// ---------------------------------------------------------------- agent setup / bundle

async function renderAgentSetup() {
  const data = await api('/api/agent-bundle');
  if (!data) return;
  const caLink = data.ca_cert
    ? `<a href="/api/ca.crt" class="action" style="text-decoration:none;display:inline-block;margin-right:8px">Download CA (.crt)</a>` : '';
  const msiBlock = data.msi_available
    ? `<a href="${esc(data.msi_url)}" class="action" style="text-decoration:none;display:inline-block;margin-right:8px">Download MSI (${(data.msi_size/1048576).toFixed(1)} MB)</a>`
    : '<span class="badge off">MSI not published yet</span> <span class="muted">— becomes available once the agent is built (Windows Server local build, or GitHub remote build below).</span>';
  const build = await api('/api/build/status').catch(() => null);
  app.innerHTML = `
    <div class="card"><h3>Company agent package</h3>
      <p class="muted">These three files make up the company bundle. Hand them out on a USB / Intranet share, or push the MSI via Intune / GPO / SCCM and drop <code>agent.json</code> + <code>ca.crt</code> into <code>C:\\ProgramData\\ITToolkit-Agent\\</code>.</p>
      <div class="row" style="flex-wrap:wrap;margin-top:10px">
        <a href="/api/agent/agent.json" class="action" style="text-decoration:none;display:inline-block;margin-right:8px">Download agent.json</a>
        ${caLink}
        <a href="/api/agent/install.cmd" class="action" style="text-decoration:none;display:inline-block;margin-right:8px">Download install-agent.cmd</a>
        ${msiBlock}
      </div>
      <p class="muted" style="margin-top:10px">Company: <code>${esc(data.company)}</code> · Server: <code>${esc(data.server_host)}</code> · Scheme: <code>${esc(data.scheme)}</code></p>
      <label>Endpoint</label>
      <label>Endpoint</label>
      <div class="code">${esc(data.agent_json.endpoint)}</div>
      <label>Agent token (keep secret — ships inside agent.json)</label>
      <div class="code">${esc(data.agent_json.token)}</div>
      <label>Self-update: rollout target version (empty = bundled ${esc(data.agent_json.agent_version)})</label>
      <div class="row" style="margin-top:4px">
        <input id="agent-rollout" type="text" value="${esc(data.rollout_target || '')}" placeholder="e.g. 1.1.0" style="flex:1;margin-right:8px">
        <button class="action" onclick="setRolloutTarget()">Save target</button>
      </div>
      <p class="muted" style="margin-top:6px">Agents with a lower installed version will silently upgrade on their next cycle.</p>
    </div>
    <div class="card"><h3>Agent MSI build</h3>
      ${build ? renderBuildPanel(build) : '<span class="muted">Build status unavailable.</span>'}
    </div>
    <div class="card"><h3>install-agent.cmd (generated live)</h3>
      <p class="muted">Installs the MSI, then writes the company <code>agent.json</code> + <code>ca.crt</code> over the bundled template.</p>
      <pre>${esc(data.install_cmd)}</pre>
    </div>
    <div class="card"><h3>agent.json preview</h3>
      <pre>${esc(JSON.stringify(data.agent_json, null, 2))}</pre>
    </div>`;
}

async function setRolloutTarget() {
  const v = document.getElementById('agent-rollout')?.value?.trim() || '';
  const r = await api('/api/agent/update-target', { method: 'PUT', body: JSON.stringify({ target_version: v }) });
  if (r) renderAgentSetup();
}

function renderBuildPanel(build) {
  const mode = build.mode || 'manual';
  let body;
  if (mode === 'local_windows') {
    body = `<p class="muted">This server builds the agent locally (Windows Server). Run <code>pwsh ./Enterprise/deploy/deploy.ps1</code> on the server — it auto-builds, signs and publishes the MSI. If the MSI is already available above, nothing to do.</p>`;
  } else if (mode === 'github') {
    const gh = build.github || {};
    const stateBadge = gh.error
      ? `<span class="badge off">${esc(gh.error)}</span>`
      : (gh.conclusion === 'success'
          ? `<span class="badge ok">build succeeded</span>`
          : (gh.conclusion === 'failure'
              ? `<span class="badge off">build failed</span>`
              : (gh.state === 'in_progress' || gh.state === 'queued'
                  ? `<span class="badge">build ${esc(gh.state)}…</span>`
                  : `<span class="badge off">no build yet</span>`)));
    body = `
      <p class="muted">Remote build via GitHub Actions on <code>${esc(build.github_repo || '—')}</code>.</p>
      <p>Status: ${stateBadge} ${gh.run_number ? `#${esc(gh.run_number)}` : ''} ${gh.html_url ? `(<a href="${esc(gh.html_url)}" target="_blank">run</a>)` : ''}</p>
      <div style="margin-top:10px">
        <button class="action" onclick="githubBuild()">Trigger GitHub build</button>
        <button class="action" style="background:transparent;color:var(--text);border:1px solid var(--line)" onclick="renderAgentSetup()">Refresh</button>
      </div>
      <p class="muted" style="margin-top:10px">Requires the repo + PAT entered at setup (repo + actions: write/read). The server fires <code>workflow_dispatch</code>, waits for success and downloads the signed MSI into the volume automatically.</p>`;
  } else {
    body = `<p class="muted">Build the MSI yourself (Windows machine): <code>build-agent.ps1</code> then <code>build-msi.ps1</code>, or run the CI <code>agent-build</code> workflow, then upload the MSI into the server's <code>agent_artifacts</code> volume.</p>`;
  }
  return body;
}

async function githubBuild() {
  const btn = event.target;
  btn.disabled = true; btn.textContent = 'Triggering…';
  try {
    const r = await api('/api/build/status');
    const repo = r.github_repo;
    if (!repo) { alert('No GitHub repo configured. Edit settings or re-run setup.'); return; }
    // validate + trigger using the stored token (never re-entered here)
    const val = await fetch('/api/build/trigger', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ repo, token: '', branch: 'main' }) });
    if (!val.ok) { const d = await val.json(); alert(d.detail || 'Trigger failed'); return; }
    renderAgentSetup();
  } catch (e) { alert('Trigger failed: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = 'Trigger GitHub build'; }
}

start();
</script>
</body>
