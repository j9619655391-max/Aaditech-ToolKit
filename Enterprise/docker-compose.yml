services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ittoolkit}
      POSTGRES_USER: ${POSTGRES_USER:-ittoolkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ittoolkit} -d ${POSTGRES_DB:-ittoolkit}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ittoolkit]

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ittoolkit}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ittoolkit}
      API_TOKEN: ${API_TOKEN:-}
      API_TOKEN_FILE: /data/api_token
      SERVER_HOST: ${SERVER_HOST:?set in .env}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DATA_DIR: /data
      ARTIFACTS_DIR: /artifacts
      COMMANDS_RUN_SCRIPT_ALLOWED: ${COMMANDS_RUN_SCRIPT_ALLOWED:-false}
      RUN_SCRIPT_ALLOWLIST: ${RUN_SCRIPT_ALLOWLIST:-}
      ALERT_EVAL_MINUTES: ${ALERT_EVAL_MINUTES:-1}
      TS_RAW_RETENTION_HOURS: ${TS_RAW_RETENTION_HOURS:-48}
      TS_HOURLY_RETENTION_DAYS: ${TS_HOURLY_RETENTION_DAYS:-30}
      TS_DAILY_RETENTION_DAYS: ${TS_DAILY_RETENTION_DAYS:-365}
      TS_ROLLUP_MINUTES: ${TS_ROLLUP_MINUTES:-60}
      MAX_METRICS_POINTS: ${MAX_METRICS_POINTS:-2000}
      METRICS_INTERVAL_SECONDS: ${METRICS_INTERVAL_SECONDS:-60}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
      WEBHOOK_ENABLED: ${WEBHOOK_ENABLED:-false}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_TYPE: ${WEBHOOK_TYPE:-generic}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-}
      BUILD_MODE: ${BUILD_MODE:-manual}
      ENVIRONMENT: ${ENVIRONMENT:-prod}
    volumes:
      - ./portal:/app/portal:ro
      - ./api/features.json:/app/features.json:ro
      - api_data:/data
      - agent_artifacts:/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ittoolkit]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      CADDY_HOST: ${CADDY_HOST:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "9443:9443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - api_data:/agent_data:ro
    networks: [ittoolkit]

volumes:
  pgdata:
  api_data:
  caddy_data:
  caddy_config:
  agent_artifacts:

networks:
  ittoolkit:
    driver: bridge
